
<svg
  width="1000"
  height="650"
  viewBox="0 0 1000 650"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop
        offset="0%"
        stop-color="#050505"/>

      <stop
        offset="100%"
        stop-color="#111111"/>

    </linearGradient>

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

      <stop
        offset="0%"
        stop-color="#00ff88"/>

      <stop
        offset="100%"
        stop-color="#00ccff"/>

    </linearGradient>

    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>

        <feMergeNode
          in="blur"/>

        <feMergeNode
          in="SourceGraphic"/>

      </feMerge>

    </filter>

    <style>

      .title {
        font-family: monospace;
        font-size: 27px;
        font-weight: bold;
        fill: #ffffff;
      }

      .subtitle {
        font-family: monospace;
        font-size: 12px;
        fill: #777777;
        letter-spacing: 2px;
      }

      .label {
        font-family: monospace;
        font-size: 11px;
        fill: #777777;
        letter-spacing: 1px;
      }

      .value {
        font-family: monospace;
        font-size: 17px;
        fill: #ffffff;
      }

      .big {
        font-family: monospace;
        font-size: 29px;
        font-weight: bold;
        fill: #ffffff;
      }

      .sha {
        font-family: monospace;
        font-size: 12px;
        fill: #00ff88;
      }

      .commit {
        font-family: monospace;
        font-size: 12px;
        fill: #dddddd;
      }

      .author {
        font-family: monospace;
        font-size: 11px;
        fill: #aaaaaa;
      }

      .date {
        font-family: monospace;
        font-size: 10px;
        fill: #666666;
      }

      .pulse {
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .35; }
      }

      .scan {
        animation: scan 4s linear infinite;
      }

      @keyframes scan {
        0% {
          transform: translateX(0);
          opacity: .05;
        }

        50% {
          opacity: .45;
        }

        100% {
          transform: translateX(1000px);
          opacity: .05;
        }
      }

    </style>

  </defs>


  <!-- =========================================
       BACKGROUND
  ========================================== -->

  <rect
    width="1000"
    height="650"
    rx="18"
    fill="url(#background)"/>


  <!-- =========================================
       HEADER
  ========================================== -->

  <text
    x="45"
    y="52"
    class="title">

    GITHUB ACTIVITY COMMAND CENTER

  </text>

  <text
    x="45"
    y="75"
