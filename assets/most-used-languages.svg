<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="328"
  viewBox="0 0 1100 328">


  <defs>

    <!-- Background grid -->

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#0b202d"
        stroke-width="1"/>

    </pattern>


    <!-- Soft glow -->

    <filter id="glow">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- Gradient -->

    <linearGradient
      id="headerLine"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

      <stop
        offset="0%"
        stop-color="#ef4444"/>

      <stop
        offset="50%"
        stop-color="#60a5fa"/>

      <stop
        offset="100%"
        stop-color="#ef4444"/>

    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="100%"
    height="100%"
    fill="#05080d"/>

  <rect
    width="100%"
    height="100%"
    fill="url(#grid)"
    opacity="0.45"/>


  <!-- ================================================= -->
  <!-- FRAME -->
  <!-- ================================================= -->

  <rect
    x="18"
    y="18"
    width="1064"
    height="292"
    rx="18"
    fill="none"
    stroke="#143a52"
    stroke-width="2"/>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text
    x="55"
    y="62"
    fill="#ef4444"
    font-family="monospace"
    font-size="13"
    font-weight="bold"
    letter-spacing="3">

    LANGUAGE MATRIX

  </text>


  <text
    x="1045"
    y="62"
    text-anchor="end"
    fill="#60a5fa"
    font-family="monospace"
    font-size="11"
    letter-spacing="2">

    LIVE REPOSITORY ANALYSIS

  </text>


  <line
    x1="55"
    y1="82"
    x2="1045"
    y2="82"
    stroke="url(#headerLine)"
    stroke-width="2"/>


  <!-- ================================================= -->
  <!-- SUMMARY -->
  <!-- ================================================= -->

  <text
    x="55"
    y="115"
    fill="#64748b"
    font-family="monospace"
    font-size="10"
    letter-spacing="2">

    LANGUAGES DETECTED

  </text>


  <text
    x="55"
    y="145"
    fill="#f8fafc"
    font-family="monospace"
    font-size="25"
    font-weight="bold">

    1

  </text>


  <text
    x="250"
    y="115"
    fill="#64748b"
    font-family="monospace"
    font-size="10"
    letter-spacing="2">

    REPOSITORIES SCANNED

  </text>


  <text
    x="250"
    y="145"
    fill="#60a5fa"
    font-family="monospace"
    font-size="25"
    font-weight="bold">

    12

  </text>


  <text
    x="500"
    y="115"
    fill="#64748b"
    font-family="monospace"
    font-size="10"
    letter-spacing="2">

    DATA POINTS

  </text>


  <text
    x="500"
    y="145"
    fill="#ef4444"
    font-family="monospace"
    font-size="25"
    font-weight="bold">

    4,028,047

  </text>


  <!-- ================================================= -->
  <!-- LANGUAGE DATA -->
  <!-- ================================================= -->

  

    <!-- LANGUAGE ROW 0 -->

    <g>

      <!-- percentage ring -->

      <circle
        cx="65"
        cy="190"
        r="22"
        fill="none"
        stroke="#102b3d"
        stroke-width="4"/>


      <circle
        cx="65"
        cy="190"
        r="22"
        fill="none"
        stroke="#DA5B0B"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="138"
        stroke-dashoffset="138"
        transform="rotate(-90 65 190)">

        <animate
          attributeName="stroke-dashoffset"
          from="138"
          to="2.1533984087077727"
          dur="1.2s"
          begin="0.0s"
          fill="freeze"/>

      </circle>


      <!-- language name -->

      <text
        x="105"
        y="195"
        fill="#f8fafc"
        font-family="monospace"
        font-size="15"
        font-weight="bold"
        letter-spacing="1">

        Jupyter Notebook

      </text>


      <!-- data track -->

      <line
        x1="280"
        y1="190"
        x2="710"
        y2="190"
        stroke="#102b3d"
        stroke-width="3"/>


      <!-- growing data bar -->

      <rect
        x="280"
        y="187"
        width="0"
        height="6"
        rx="3"
        fill="#DA5B0B">

        <animate
          attributeName="width"
          from="0"
          to="423.29013539315696"
          dur="1.4s"
          begin="0.0s"
          fill="freeze"/>

      </rect>


      <!-- moving data particle -->

      <circle
        cx="280"
        cy="190"
        r="3"
        fill="#DA5B0B">

        <animate
          attributeName="cx"
          from="280"
          to="703.290135393157"
          dur="1.4s"
          begin="0.0s"
          fill="freeze"/>

        <animate
          attributeName="r"
          values="2;5;2"
          dur="1.4s"
          begin="0.0s"
          fill="freeze"/>

      </circle>


      <!-- percentage -->

      <text
        x="760"
        y="195"
        fill="#DA5B0B"
        font-family="monospace"
        font-size="15"
        font-weight="bold">

        98.4%

      </text>


      <!-- byte count -->

      <text
        x="1035"
        y="195"
        text-anchor="end"
        fill="#64748b"
        font-family="monospace"
        font-size="10">

        3,965,192 BYTES

      </text>

    </g>
    


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <line
    x1="55"
    y1="263"
    x2="1045"
    y2="263"
    stroke="#143a52"/>


  <circle
    cx="70"
    cy="288"
    r="4"
    fill="#22c55e">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="2s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="85"
    y="292"
    fill="#22c55e"
    font-family="monospace"
    font-size="10"
    letter-spacing="2">

    REPOSITORY TELEMETRY ACTIVE

  </text>


  <text
    x="1045"
    y="292"
    text-anchor="end"
    fill="#475569"
    font-family="monospace"
    font-size="10">

    GITHUB LINGUIST DATA

  </text>


  <!-- ================================================= -->
  <!-- DECORATIVE ORBIT -->
  <!-- ================================================= -->

  <g
    transform="translate(1000 125)">

    <circle
      r="28"
      fill="none"
      stroke="#143a52"
      stroke-width="1"/>

    <circle
      r="18"
      fill="none"
      stroke="#60a5fa"
      stroke-width="1"
      stroke-dasharray="4 5">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="8s"
        repeatCount="indefinite"/>

    </circle>

    <circle
      cx="18"
      cy="0"
      r="3"
      fill="#ef4444">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>

  </g>

</svg>
