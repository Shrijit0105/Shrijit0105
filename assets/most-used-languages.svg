
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="980"
  height="360"
  viewBox="0 0 980 360"
>

  <defs>

    <linearGradient
      id="hudGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >

      <stop
        offset="0%"
        stop-color="#00ff88"
      />

      <stop
        offset="100%"
        stop-color="#00ffaa"
      />

    </linearGradient>


    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode
          in="SourceGraphic"
        />

      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="100%"
    height="100%"
    rx="14"
    fill="#050807"
  />


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect
    x="1"
    y="1"
    width="978"
    height="358"
    rx="14"
    fill="none"
    stroke="#00ff88"
    stroke-opacity="0.35"
  >

    <animate
      attributeName="stroke-opacity"
      values="0.25;0.55;0.25"
      dur="3s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text
    x="55"
    y="43"
    fill="#00ff88"
    font-family="monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    MOST USED LANGUAGES
  </text>


  <text
    x="925"
    y="43"
    text-anchor="end"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
  >
    AUTO DETECTED
  </text>


  <!-- ================================================= -->
  <!-- SCANNER -->
  <!-- ================================================= -->

  <rect
    x="40"
    y="70"
    width="900"
    height="1"
    fill="#00ff88"
    opacity="0.12"
  />


  <rect
    x="40"
    y="69"
    width="120"
    height="2"
    fill="#00ff88"
    filter="url(#glow)"
  >

    <animate
      attributeName="x"
      values="40;820;40"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ================================================= -->
  <!-- DESCRIPTION -->
  <!-- ================================================= -->

  <text
    x="55"
    y="102"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
  >
    AGGREGATED ACROSS PUBLIC NON-FORK REPOSITORIES
  </text>


  <!-- ================================================= -->
  <!-- LANGUAGE ROWS -->
  <!-- ================================================= -->

  
        <!-- LANGUAGE 1 -->

        <text
          x="60"
          y="145"
          fill="#d7ffea"
          font-family="monospace"
          font-size="13"
          font-weight="700"
        >
          Jupyter Notebook
        </text>


        <text
          x="900"
          y="145"
          text-anchor="end"
          fill="#00ff88"
          font-family="monospace"
          font-size="12"
          font-weight="700"
        >
          98.4%
        </text>


        <rect
          x="60"
          y="160"
          width="560"
          height="12"
          rx="6"
          fill="#0b1b14"
          stroke="#00ff88"
          stroke-opacity="0.20"
        />


        <rect
          x="60"
          y="160"
          width="0"
          height="12"
          rx="6"
          fill="url(#hudGradient)"
          filter="url(#glow)"
        >

          <animate
            attributeName="width"
            from="0"
            to="551"
            dur="1.3s"
            begin="0.0s"
            fill="freeze"
          />

        </rect>


        <!-- BAR SCANNER -->

        <rect
          x="60"
          y="160"
          width="55"
          height="12"
          rx="6"
          fill="#ffffff"
          opacity="0.16"
        >

          <animate
            attributeName="x"
            values="60;556;60"
            dur="2.6s"
            begin="0.0s"
            repeatCount="indefinite"
          />

        </rect>


        <text
          x="640"
          y="170"
          fill="#35694f"
          font-family="monospace"
          font-size="9"
        >
          3,965,192 BYTES
        </text>
        


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <line
    x1="55"
    y1="305"
    x2="925"
    y2="305"
    stroke="#00ff88"
    stroke-opacity="0.15"
  />


  <text
    x="55"
    y="332"
    fill="#35694f"
    font-family="monospace"
    font-size="9"
    letter-spacing="1"
  >
    LANGUAGE TELEMETRY ONLINE
  </text>


  <text
    x="925"
    y="332"
    text-anchor="end"
    fill="#35694f"
    font-family="monospace"
    font-size="9"
  >
    TOP 1 LANGUAGES
  </text>

</svg>
