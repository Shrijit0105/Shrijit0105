          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.40"
        />

        <text
          x="202.0"
          y="351"
          text-anchor="middle"
          fill="#9affc7"
          font-family="monospace"
          font-size="10"
          font-weight="700"
        >
          C++
        </text>
        
        <rect
          x="259"
          y="330"
          width="124"
          height="32"
          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.40"
        />

        <text
          x="321.0"
          y="351"
          text-anchor="middle"
          fill="#9affc7"
