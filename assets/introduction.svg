    INITIALIZING DEVELOPER PROFILE...
  </text>


  <text
    x="925"
    y="455"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="10"
  >
    [ ONLINE ]
  </text>


  <!-- ================================================= -->
  <!-- CURSOR -->
  <!-- ================================================= -->

  <rect
    x="55"
    y="468"
    width="7"
    height="14"
    fill="#00ff88"
  >

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      repeatCount="indefinite"
    />

  </rect>

</svg>
