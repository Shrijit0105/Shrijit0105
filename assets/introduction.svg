          width="90"
          height="32"
          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.40"
        />

        <text
          x="542.0"
          y="351"
          text-anchor="middle"
          fill="#9affc7"
          font-family="monospace"
          font-size="10"
          font-weight="700"
        >
          DSA
        </text>
        
        <rect
          x="599"
          y="330"
          width="124"
          height="32"
          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.40"
        />

        <text
          x="661.0"
          y="351"
          text-anchor="middle"
          fill="#9affc7"
          font-family="monospace"
          font-size="10"
          font-weight="700"
        >
          Full Stack
        </text>
        


  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <line
    x1="55"
    y1="425"
    x2="925"
    y2="425"
    stroke="#00ff88"
    stroke-opacity="0.15"
  />


  <text
    x="55"
    y="455"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
