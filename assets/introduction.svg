          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.40"
        />

        <text
          x="440.0"
          y="351"
          text-anchor="middle"
          fill="#9affc7"
          font-family="monospace"
          font-size="10"
          font-weight="700"
        >
          AI/ML
        </text>
        
        <rect
          x="497"
