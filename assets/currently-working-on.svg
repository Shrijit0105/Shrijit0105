<svg
  xmlns="http://www.w3.org/2000/svg"
  width="980"
  height="645"
  viewBox="0 0 980 645"
>

  <defs>

    <linearGradient
      id="hudGradient"
      x1="0"
      x2="1"
      y1="0"
      y2="0"
    >
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="progressClip">
      <rect
        x="55"
        y="440"
        width="870"
        height="16"
        rx="8"
      />
    </clipPath>

  </defs>

  <!-- BACKGROUND -->

  <rect
    width="100%"
    height="100%"
    rx="14"
    fill="#050807"
  />

  <!-- OUTER BORDER -->

  <rect
    x="1"
    y="1"
    width="978"
    height="643"
    rx="14"
    fill="none"
    stroke="#00ff88"
    stroke-width="1"
    stroke-opacity="0.35"
  >
    <animate
      attributeName="stroke-opacity"
      values="0.25;0.55;0.25"
      dur="3s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- TOP SCAN LINE -->

  <rect
    x="40"
    y="70"
    width="900"
    height="1"
    fill="#00ff88"
    opacity="0.15"
  />

  <rect
    x="40"
    y="70"
    width="120"
    height="2"
    fill="#00ff88"
    filter="url(#glow)"
  >
    <animate
      attributeName="x"
      values="40;820;40"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- HEADER -->

  <text
    x="55"
    y="42"
    fill="#00ff88"
    font-family="monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    CURRENTLY WORKING ON
  </text>

  <text
    x="925"
    y="42"
    text-anchor="end"
    fill="#6affb3"
    font-family="monospace"
    font-size="11"
    letter-spacing="1"
  >
    DEVELOPMENT TELEMETRY
  </text>

  <!-- STATUS -->

  <circle
    cx="890"
    cy="103"
    r="6"
    fill="#00ff88"
    filter="url(#glow)"
  >
    <animate
      attributeName="r"
      values="5;8;5"
      dur="1.6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="1.6s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="870"
    y="108"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="12"
    font-weight="700"
    letter-spacing="1"
  >
    BUILDING
  </text>

  <!-- MAIN PROJECT PANEL -->

  <rect
    x="40"
    y="88"
    width="900"
    height="235"
    rx="10"
    fill="#07100c"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />

  <!-- PROJECT LABEL -->

  <text
    x="60"
    y="125"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    PROJECT
  </text>

  <text
    x="60"
    y="155"
    fill="#f1fff7"
    font-family="monospace"
    font-size="25"
    font-weight="700"
  >
    Cognifyz Restaurant ML
  </text>

  <!-- CATEGORY -->

  <text
    x="60"
    y="190"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    CATEGORY
  </text>

  <text
    x="60"
    y="214"
    fill="#00ff88"
    font-family="monospace"
    font-size="14"
    font-weight="700"
  >
    Machine Learning
  </text>

  <!-- STATUS -->

  <text
    x="470"
    y="125"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    CURRENT STATUS
  </text>

  <text
    x="470"
    y="155"
    fill="#f1fff7"
    font-family="monospace"
    font-size="18"
    font-weight="700"
  >
    Feature Engineering
  </text>

  <!-- CURSOR -->

  <rect
    x="470"
    y="169"
    width="8"
    height="18"
    fill="#00ff88"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- ACTIVE SIGNAL -->

  <text
    x="60"
    y="270"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    SYSTEM SIGNAL
  </text>

  <text
    x="60"
    y="294"
    fill="#9affc7"
    font-family="monospace"
    font-size="12"
  >
    ACTIVE DEVELOPMENT SESSION
  </text>

  <!-- TECH STACK -->

  <text
    x="55"
    y="345"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    ACTIVE STACK
  </text>

  
      <g>
        <rect
          x="55"
          y="365"
          width="90"
          height="32"
          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.45"
        />

        <text
          x="100.0"
          y="386"
          text-anchor="middle"
          class="chip"
        >Python</text>
      </g>
    
      <g>
        <rect
          x="157"
          y="365"
          width="90"
          height="32"
          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.45"
        />

        <text
          x="202.0"
          y="386"
          text-anchor="middle"
          class="chip"
        >Pandas</text>
      </g>
    
      <g>
        <rect
          x="259"
          y="365"
          width="142"
          height="32"
          rx="6"
          fill="#07130f"
          stroke="#00ff88"
          stroke-opacity="0.45"
        />

        <text
          x="330.0"
          y="386"
          text-anchor="middle"
          class="chip"
        >Scikit-learn</text>
      </g>
    

  <!-- PROGRESS -->

  <text
    x="55"
    y="415"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    PROJECT PROGRESS
  </text>

  <text
    x="925"
    y="415"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="13"
    font-weight="700"
  >
    72%
  </text>

  <!-- PROGRESS BACKGROUND -->

  <rect
    x="55"
    y="440"
    width="870"
    height="16"
    rx="8"
    fill="#0b1b14"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />

  <!-- PROGRESS FILL -->

  <rect
    x="55"
    y="440"
    width="0"
    height="16"
    rx="8"
    fill="url(#hudGradient)"
    clip-path="url(#progressClip)"
    filter="url(#glow)"
  >
    <animate
      attributeName="width"
      from="0"
      to="626"
      dur="1.8s"
      fill="freeze"
    />
  </rect>

  <!-- PROGRESS SCANNER -->

  <rect
    x="55"
    y="440"
    width="70"
    height="16"
    rx="8"
    fill="#ffffff"
    opacity="0.18"
    clip-path="url(#progressClip)"
  >
    <animate
      attributeName="x"
      values="55;611;55"
      dur="2.8s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- NEXT OBJECTIVE -->

  <rect
    x="40"
    y="505"
    width="900"
    height="78"
    rx="10"
    fill="#07100c"
    stroke="#00ff88"
    stroke-opacity="0.20"
  />

  <text
    x="60"
    y="532"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    NEXT OBJECTIVE
  </text>

  <text
    x="60"
    y="560"
    fill="#d7ffea"
    font-family="monospace"
    font-size="14"
    font-weight="700"
  >
    Model Evaluation &amp; Feature Optimization
  </text>

  <!-- FOOTER -->

  <text
    x="55"
    y="617"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
  >
    TELEMETRY ONLINE
  </text>

  <text
    x="925"
    y="617"
    text-anchor="end"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
  >
    LAST UPDATED: 2026-09-25 19:21 UTC
  </text>

</svg>
