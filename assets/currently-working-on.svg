<svg
  xmlns="http://www.w3.org/2000/svg"
  width="980"
  height="730"
  viewBox="0 0 980 730"
>

  <defs>

    <linearGradient
      id="hudGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >

      <stop
        offset="0%"
        stop-color="#00ff88"
      />

      <stop
        offset="100%"
        stop-color="#00ffaa"
      />

    </linearGradient>


    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode
          in="SourceGraphic"
        />

      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="980"
    height="730"
    rx="14"
    fill="#050807"
  />


  <!-- ================================================= -->
  <!-- BORDER -->
  <!-- ================================================= -->

  <rect
    x="1"
    y="1"
    width="978"
    height="728"
    rx="14"
    fill="none"
    stroke="#00ff88"
    stroke-opacity="0.35"
  >

    <animate
      attributeName="stroke-opacity"
      values="0.25;0.55;0.25"
      dur="3s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <text
    x="55"
    y="43"
    fill="#00ff88"
    font-family="monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    CURRENTLY WORKING ON
  </text>


  <text
    x="925"
    y="43"
    text-anchor="end"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
  >
    AUTO DEVELOPER TELEMETRY
  </text>


  <!-- ================================================= -->
  <!-- SCANNER -->
  <!-- ================================================= -->

  <rect
    x="40"
    y="70"
    width="900"
    height="1"
    fill="#00ff88"
    opacity="0.12"
  />


  <rect
    x="40"
    y="69"
    width="120"
    height="2"
    fill="#00ff88"
    filter="url(#glow)"
  >

    <animate
      attributeName="x"
      values="40;820;40"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ================================================= -->
  <!-- MAIN PROJECT PANEL -->
  <!-- ================================================= -->

  <rect
    x="40"
    y="90"
    width="900"
    height="235"
    rx="10"
    fill="#07100c"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />


  <!-- STATUS LIGHT -->

  <circle
    cx="890"
    cy="117"
    r="6"
    fill="#00ff88"
    filter="url(#glow)"
  >

    <animate
      attributeName="r"
      values="5;8;5"
      dur="1.5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0.4;1"
      dur="1.5s"
      repeatCount="indefinite"
    />

  </circle>


  <text
    x="870"
    y="122"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="10"
    font-weight="700"
  >
    DORMANT
  </text>


  <!-- PROJECT -->

  <text
    x="60"
    y="130"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
