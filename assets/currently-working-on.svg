          fill="#35694f"
          font-family="monospace"
          font-size="11"
        >
          No recent file telemetry available
        </text>
        


  <!-- ================================================= -->
  <!-- ACTIVITY SCORE -->
  <!-- ================================================= -->

  <text
    x="60"
    y="510"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    DEVELOPMENT ACTIVITY
  </text>


  <text
    x="920"
    y="510"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    16%
  </text>


  <rect
    x="60"
    y="525"
    width="860"
    height="15"
    rx="8"
    fill="#0b1b14"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />


  <rect
    x="60"
    y="525"
    width="0"
    height="15"
    rx="8"
    fill="url(#hudGradient)"
    filter="url(#glow)"
  >

    <animate
      attributeName="width"
      from="0"
      to="139"
      dur="1.5s"
      fill="freeze"
    />

  </rect>


  <!-- ================================================= -->
  <!-- TELEMETRY CARDS -->
  <!-- ================================================= -->

  <rect
