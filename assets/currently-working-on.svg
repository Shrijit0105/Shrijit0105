<svg
  xmlns="http://www.w3.org/2000/svg"
  width="980"
  height="720"
  viewBox="0 0 980 720"
>

  <defs>

    <linearGradient
      id="hudGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >

      <stop
        offset="0%"
        stop-color="#00ff88"
      />

      <stop
        offset="100%"
        stop-color="#00ffaa"
      />

    </linearGradient>


    <filter id="glow">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode
          in="SourceGraphic"
        />

      </feMerge>

    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="980"
    height="720"
    rx="14"
    fill="#050807"
  />


  <!-- BORDER -->

  <rect
    x="1"
    y="1"
    width="978"
    height="718"
    rx="14"
    fill="none"
    stroke="#00ff88"
    stroke-width="1"
    stroke-opacity="0.35"
  >

    <animate
      attributeName="stroke-opacity"
      values="0.25;0.55;0.25"
      dur="3s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- HEADER -->

  <text
    x="55"
    y="43"
    fill="#00ff88"
    font-family="monospace"
    font-size="18"
    font-weight="700"
    letter-spacing="2"
  >
    CURRENTLY WORKING ON
  </text>


  <text
    x="925"
    y="43"
    text-anchor="end"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
  >
    AUTO TELEMETRY
  </text>


  <!-- SCANNER -->

  <rect
    x="40"
    y="70"
    width="900"
    height="1"
    fill="#00ff88"
    opacity="0.12"
  />

  <rect
    x="40"
    y="69"
    width="120"
    height="2"
    fill="#00ff88"
    filter="url(#glow)"
  >

    <animate
      attributeName="x"
      values="40;820;40"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- MAIN PANEL -->

  <rect
    x="40"
    y="90"
    width="900"
    height="235"
    rx="10"
    fill="#07100c"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />


  <!-- ACTIVE INDICATOR -->

  <circle
    cx="890"
    cy="118"
    r="6"
    fill="#00ff88"
    filter="url(#glow)"
  >

    <animate
      attributeName="r"
      values="5;8;5"
      dur="1.5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="1.5s"
      repeatCount="indefinite"
    />

  </circle>


  <text
    x="870"
    y="123"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="11"
    font-weight="700"
  >
    PAUSED
  </text>


  <!-- PROJECT -->

  <text
    x="60"
    y="130"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    ACTIVE PROJECT
  </text>


  <text
    x="60"
    y="163"
    fill="#f1fff7"
    font-family="monospace"
    font-size="25"
    font-weight="700"
  >
    Zomato_Sentiment_Analysis
  </text>


  <!-- TASK -->

  <text
    x="60"
    y="205"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    CURRENT DEVELOPMENT AREA
  </text>


  <text
    x="60"
    y="232"
    fill="#00ff88"
    font-family="monospace"
    font-size="16"
    font-weight="700"
  >
    Developer Infrastructure
  </text>


  <!-- LAST COMMIT -->

  <text
    x="60"
    y="275"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    LAST COMMIT
  </text>


  <text
    x="60"
    y="298"
    fill="#c8ffe0"
    font-family="monospace"
    font-size="11"
  >
    Update README.md
  </text>


  <!-- ACTIVITY -->

  <text
    x="55"
    y="355"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    RECENTLY CHANGED FILES
  </text>


  
        <text
          x="55"
          y="365"
          fill="#9affc7"
          font-family="monospace"
          font-size="11"
        >
          README.md
        </text>
        


  <!-- ACTIVITY BAR -->

  <text
    x="55"
    y="505"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    ACTIVITY LEVEL
  </text>


  <text
    x="925"
    y="505"
    text-anchor="end"
    fill="#00ff88"
    font-family="monospace"
    font-size="12"
    font-weight="700"
  >
    35%
  </text>


  <rect
    x="55"
    y="520"
    width="870"
    height="15"
    rx="8"
    fill="#0b1b14"
    stroke="#00ff88"
    stroke-opacity="0.25"
  />


  <rect
    x="55"
    y="520"
    width="0"
    height="15"
    rx="8"
    fill="url(#hudGradient)"
    filter="url(#glow)"
  >

    <animate
      attributeName="width"
      from="0"
      to="304"
      dur="1.5s"
      fill="freeze"
    />

  </rect>


  <!-- LAST ACTIVITY -->

  <text
    x="55"
    y="575"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    LAST COMMIT TIME
  </text>


  <text
    x="55"
    y="598"
    fill="#c8ffe0"
    font-family="monospace"
    font-size="12"
  >
    2026-09-21 17:21 UTC
  </text>


  <!-- SYSTEM -->

  <text
    x="925"
    y="598"
    text-anchor="end"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
  >
    AUTO-DETECTED
  </text>


  <!-- FOOTER -->

  <text
    x="55"
    y="680"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
    letter-spacing="1"
  >
    GITHUB ACTIVITY TELEMETRY ONLINE
  </text>


  <text
    x="925"
    y="680"
    text-anchor="end"
    fill="#35694f"
    font-family="monospace"
    font-size="10"
  >
    UPDATED 2026-09-25 19:25 UTC
  </text>

</svg>
