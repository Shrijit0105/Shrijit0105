    CURRENT DEVELOPMENT AREA
  </text>


  <text
    x="60"
    y="233"
    fill="#00ff88"
    font-family="monospace"
    font-size="16"
    font-weight="700"
  >
    DOCUMENTATION
  </text>


  <!-- SIGNAL -->

  <text
    x="60"
    y="275"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    DEVELOPMENT SIGNAL
  </text>


  <text
    x="60"
    y="299"
    fill="#c8ffe0"
    font-family="monospace"
    font-size="12"
  >
    PROJECT PAUSED
  </text>


  <!-- ================================================= -->
  <!-- RECENT FILES -->
  <!-- ================================================= -->

  <text
    x="60"
    y="350"
    fill="#4d9975"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    RECENTLY TOUCHED FILES
  </text>


  
        <text
          x="60"
