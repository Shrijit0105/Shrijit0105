name: Project Health Monitor

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  project-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Project Health SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          # ============================================================
          # PROJECTS TO MONITOR
          # ============================================================

          PROJECTS = [
              "Shrijit0105",
              "Covid19-Adverse-effects",
              "Restaurant_Pred",
              "Shopper_Spectrum"
          ]

          USERNAME = "Shrijit0105"

          # ============================================================
          # SVG DIMENSIONS
          # ============================================================

          WIDTH = 980

          HEADER_HEIGHT = 125
          CARD_HEIGHT = 82
          CARD_GAP = 18
          FOOTER_HEIGHT = 70
          PADDING = 25

          TOTAL_HEIGHT = (
              HEADER_HEIGHT
              + len(PROJECTS) * CARD_HEIGHT
              + max(0, len(PROJECTS) - 1) * CARD_GAP
              + FOOTER_HEIGHT
              + PADDING
          )

          # ============================================================
          # GITHUB API
          # ============================================================

          TOKEN = __import__("os").environ["GH_TOKEN"]

          def github_request(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Project-Health-Monitor"
                  }
              )

              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.loads(response.read().decode("utf-8"))

              except urllib.error.HTTPError as error:
                  print(f"GitHub API error {error.code}: {url}")
                  return None

              except Exception as error:
                  print(f"Request error: {error}")
                  return None

          # ============================================================
          # CHECK PROJECTS
          # ============================================================

          project_data = []

          print("Checking repositories...")

          for repo in PROJECTS:

              print(f"Checking {repo}...")

              data = github_request(
                  f"https://api.github.com/repos/{USERNAME}/{repo}"
              )

              if data is None:
                  project_data.append({
                      "name": repo,
                      "status": "UNAVAILABLE",
                      "branch": "UNKNOWN",
                      "updated": "N/A",
                      "color": "#ff4d6d"
                  })
                  continue

              default_branch = data.get(
                  "default_branch",
                  "main"
              )

              updated_at = data.get(
                  "pushed_at",
                  data.get("updated_at", "")
              )

              if updated_at:
                  try:
                      dt = datetime.fromisoformat(
                          updated_at.replace("Z", "+00:00")
                      )

                      updated = dt.strftime(
                          "%Y-%m-%d %H:%M UTC"
                      )

                  except Exception:
                      updated = "Unknown"

              else:
                  updated = "Unknown"

              project_data.append({
                  "name": repo,
                  "status": "ONLINE",
                  "branch": default_branch,
                  "updated": updated,
                  "color": "#00ff88"
              })

          # ============================================================
          # XML ESCAPE
          # ============================================================

          def esc(value):
              return escape(str(value))

          # ============================================================
          # SVG HELPERS
          # ============================================================

          svg = []

          svg.append(
              f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="{WIDTH}"
              height="{TOTAL_HEIGHT}"
              viewBox="0 0 {WIDTH} {TOTAL_HEIGHT}">'''
          )

          # ============================================================
          # DEFINITIONS
          # ============================================================

          svg.append(f'''
          <defs>

            <linearGradient
              id="bgGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="1">

              <stop offset="0%" stop-color="#05080c"/>
              <stop offset="50%" stop-color="#07110e"/>
              <stop offset="100%" stop-color="#030607"/>

            </linearGradient>

            <linearGradient
              id="scannerGradient"
              x1="0"
              y1="0"
              x2="1"
              y2="0">

              <stop
                offset="0%"
                stop-color="#00ff88"
                stop-opacity="0"/>

              <stop
                offset="50%"
                stop-color="#00ff88"
                stop-opacity="0.75"/>

              <stop
                offset="100%"
                stop-color="#00ff88"
                stop-opacity="0"/>

            </linearGradient>

            <filter id="glow">
              <feGaussianBlur
                stdDeviation="3"
                result="blur"/>
            </filter>

            <clipPath id="hudClip">

              <rect
                x="2"
                y="2"
                width="{WIDTH - 4}"
                height="{TOTAL_HEIGHT - 4}"
                rx="22"/>

            </clipPath>

          </defs>
          ''')

          # ============================================================
          # BACKGROUND
          # ============================================================

          svg.append(f'''
          <rect
            x="2"
            y="2"
            width="{WIDTH - 4}"
            height="{TOTAL_HEIGHT - 4}"
            rx="22"
            fill="url(#bgGradient)"
            stroke="#00ff88"
            stroke-opacity="0.35"
            stroke-width="2"/>
          ''')

          # ============================================================
          # GRID
          # ============================================================

          grid_lines = []

          for x in range(40, WIDTH, 40):

              grid_lines.append(
                  f'''
                  <line
                    x1="{x}"
                    y1="0"
                    x2="{x}"
                    y2="{TOTAL_HEIGHT}"
                    stroke="#00ff88"
                    stroke-opacity="0.045"/>
                  '''
              )

          for y in range(40, TOTAL_HEIGHT, 40):

              grid_lines.append(
                  f'''
                  <line
                    x1="0"
                    y1="{y}"
                    x2="{WIDTH}"
                    y2="{y}"
                    stroke="#00ff88"
                    stroke-opacity="0.045"/>
                  '''
              )

          svg.append(
              '<g clip-path="url(#hudClip)">'
              + "".join(grid_lines)
              + '</g>'
          )

          # ============================================================
          # HEADER
          # ============================================================

          svg.append('''
          <text
            x="42"
            y="48"
            fill="#00ff88"
            font-family="monospace"
            font-size="25"
            font-weight="bold"
            letter-spacing="2">
            PROJECT HEALTH MONITOR
          </text>
          ''')

          svg.append('''
          <text
            x="43"
            y="76"
            fill="#8aa89a"
            font-family="monospace"
            font-size="13"
            letter-spacing="1">
            REAL-TIME REPOSITORY STATUS
          </text>
          ''')

          # ============================================================
          # MONITORING INDICATOR
          # ============================================================

          svg.append('''
          <circle
            cx="900"
            cy="50"
            r="6"
            fill="#00ff88">

            <animate
              attributeName="r"
              values="5;9;5"
              dur="1.8s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

            <animate
              attributeName="opacity"
              values="0.45;1;0.45"
              dur="1.8s"
              repeatCount="indefinite"/>

          </circle>
          ''')

          svg.append('''
          <text
            x="918"
            y="55"
            fill="#00ff88"
            font-family="monospace"
            font-size="11"
            text-anchor="end"
            letter-spacing="1">
            MONITORING
          </text>
          ''')

          # ============================================================
          # PROJECT CARDS
          # ============================================================

          card_start_y = HEADER_HEIGHT

          for index, project in enumerate(project_data):

              y = card_start_y + index * (
                  CARD_HEIGHT + CARD_GAP
              )

              name = esc(project["name"])
              status = esc(project["status"])
              branch = esc(project["branch"])
              updated = esc(project["updated"])
              color = project["color"]

              # Card background
              svg.append(f'''
              <rect
                x="35"
                y="{y}"
                width="{WIDTH - 70}"
                height="{CARD_HEIGHT}"
                rx="14"
                fill="#07100d"
                stroke="#00ff88"
                stroke-opacity="0.18"
                stroke-width="1.5"/>
              ''')

              # Left status indicator
              svg.append(f'''
              <circle
                cx="62"
                cy="{y + 41}"
                r="6"
                fill="{color}">

                <animate
                  attributeName="r"
                  values="5;8;5"
                  dur="2s"
                  begin="{index * 0.25}s"
                  repeatCount="indefinite"
                  calcMode="spline"
                  keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

                <animate
                  attributeName="opacity"
                  values="0.55;1;0.55"
                  dur="2s"
                  begin="{index * 0.25}s"
                  repeatCount="indefinite"/>

              </circle>
              ''')

              # Project name
              svg.append(f'''
              <text
                x="85"
                y="{y + 32}"
                fill="#e8fff3"
                font-family="monospace"
                font-size="16"
                font-weight="bold">
                {name}
              </text>
              ''')

              # Status
              svg.append(f'''
              <text
                x="85"
                y="{y + 56}"
                fill="{color}"
                font-family="monospace"
                font-size="11"
                letter-spacing="1">
                STATUS: {status}
              </text>
              ''')

              # Branch
              svg.append(f'''
              <text
                x="500"
                y="{y + 32}"
                fill="#9ab4a5"
                font-family="monospace"
                font-size="12">
                BRANCH
              </text>
              ''')

              svg.append(f'''
              <text
                x="500"
                y="{y + 55}"
                fill="#d9eee2"
                font-family="monospace"
                font-size="13">
                {branch}
              </text>
              ''')

              # Last update
              svg.append(f'''
              <text
                x="700"
                y="{y + 32}"
                fill="#9ab4a5"
                font-family="monospace"
                font-size="12">
                LAST UPDATE
              </text>
              ''')

              svg.append(f'''
              <text
                x="700"
                y="{y + 55}"
                fill="#d9eee2"
                font-family="monospace"
                font-size="11">
                {updated}
              </text>
              ''')

          # ============================================================
          # SCANNER BEAM
          # ============================================================

          scanner_top = HEADER_HEIGHT - 5
          scanner_height = (
              len(PROJECTS) * CARD_HEIGHT
              + max(0, len(PROJECTS) - 1) * CARD_GAP
          )

          svg.append(f'''
          <g clip-path="url(#hudClip)">

            <rect
              x="35"
              y="{scanner_top}"
              width="18"
              height="{scanner_height}"
              fill="url(#scannerGradient)"
              opacity="0.20">

              <animate
                attributeName="x"
                values="35;927;35"
                dur="5s"
                repeatCount="indefinite"
                calcMode="spline"
                keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

            </rect>

            <rect
              x="44"
              y="{scanner_top}"
              width="2"
              height="{scanner_height}"
              fill="#00ff88"
              opacity="0.8">

              <animate
                attributeName="x"
                values="44;936;44"
                dur="5s"
                repeatCount="indefinite"
                calcMode="spline"
                keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

            </rect>

          </g>
          ''')

          # ============================================================
          # FOOTER
          # ============================================================

          footer_y = (
              HEADER_HEIGHT
              + len(PROJECTS) * CARD_HEIGHT
              + max(0, len(PROJECTS) - 1) * CARD_GAP
              + 32
          )

          svg.append(f'''
          <line
            x1="42"
            y1="{footer_y}"
            x2="{WIDTH - 42}"
            y2="{footer_y}"
            stroke="#00ff88"
            stroke-opacity="0.15"/>
          ''')

          svg.append(f'''
          <text
            x="42"
            y="{footer_y + 30}"
            fill="#63796d"
            font-family="monospace"
            font-size="11">
            AUTO-SCAN • GITHUB ACTIONS
          </text>
          ''')

          svg.append(f'''
          <text
            x="{WIDTH - 42}"
            y="{footer_y + 30}"
            fill="#63796d"
            font-family="monospace"
            font-size="11"
            text-anchor="end">
            LAST SCAN: {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}
          </text>
          ''')

          # ============================================================
          # OUTER SCAN BORDER PULSE
          # ============================================================

          svg.append(f'''
          <rect
            x="3"
            y="3"
            width="{WIDTH - 6}"
            height="{TOTAL_HEIGHT - 6}"
            rx="21"
            fill="none"
            stroke="#00ff88"
            stroke-width="1"
            stroke-opacity="0.25">

            <animate
              attributeName="stroke-opacity"
              values="0.15;0.45;0.15"
              dur="3.5s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

          </rect>
          ''')

          # ============================================================
          # CLOSE SVG
          # ============================================================

          svg.append("</svg>")

          # ============================================================
          # WRITE FILE
          # ============================================================

          output = "\n".join(svg)

          with open(
              "assets/project-health.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(output)

          print(
              f"Generated project-health.svg "
              f"({WIDTH}x{TOTAL_HEIGHT})"
          )

          PY

      - name: Commit Project Health SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/project-health.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update project health monitor"
            git push
          fi
