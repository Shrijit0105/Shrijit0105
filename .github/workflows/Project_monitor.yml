name: Project Health Monitor

on:
  schedule:
    # Run once every day
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  project-health:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # CHECK PROJECTS
      # ==========================================

      - name: Check project repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          USERNAME="${{ github.repository_owner }}"

          mkdir -p assets

          echo "Checking repositories..."

          # --------------------------------------
          # Projects to monitor
          # --------------------------------------

          PROJECTS=(
            "Shrijit0105"
            "Covid19-Adverse-effects"
            "Restraunt_Pred"
            "Shopper_Spectrum"
            
          )

          # --------------------------------------
          # Generate project status JSON
          # --------------------------------------

          echo "{" > project-health.json

          FIRST=true

          for REPO in "${PROJECTS[@]}"
          do

            echo "Checking $REPO..."

            RESPONSE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$USERNAME/$REPO")

            if [ $? -eq 0 ]; then

              STATUS="HEALTHY"

              BRANCH=$(echo "$RESPONSE" | jq -r '.default_branch')

              UPDATED=$(echo "$RESPONSE" | jq -r '.updated_at')

            else

              STATUS="OFFLINE"

              BRANCH="N/A"

              UPDATED="N/A"

            fi


            if [ "$FIRST" = false ]; then
              echo "," >> project-health.json
            fi

            FIRST=false


            echo "\"$REPO\": {" >> project-health.json

            echo "\"status\": \"$STATUS\"," >> project-health.json

            echo "\"branch\": \"$BRANCH\"," >> project-health.json

            echo "\"updated\": \"$UPDATED\"" >> project-health.json

            echo "}" >> project-health.json

          done

          echo "}" >> project-health.json


          echo ""
          echo "================================="
          echo "PROJECT HEALTH"
          echo "================================="

          cat project-health.json

      - name: Generate Animated Project Health GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --quiet pillow

          python3 <<'PY'
          import os
          import json
          import subprocess
          from PIL import Image, ImageDraw, ImageFont
          from datetime import datetime, timezone

          # ==========================================
          # CONFIG
          # ==========================================

          OWNER = "${{ github.repository_owner }}"

          PROJECTS = [
              "Shrijit0105",
              "Covid19-Adverse-effects",
              "Restaurant_Pred",
              "Shopper_Spectrum"
          ]

          WIDTH = 980

          HEADER = 115
          CARD_HEIGHT = 78
          CARD_GAP = 18
          FOOTER = 65
          PADDING = 25

          HEIGHT = (
              HEADER
              + len(PROJECTS) * CARD_HEIGHT
              + max(0, len(PROJECTS) - 1) * CARD_GAP
              + FOOTER
              + PADDING
          )

          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"
          BOLD_FONT_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"

          TITLE_FONT = ImageFont.truetype(BOLD_FONT_PATH, 24)
          REPO_FONT = ImageFont.truetype(BOLD_FONT_PATH, 15)
          SMALL_FONT = ImageFont.truetype(FONT_PATH, 10)
          STATUS_FONT = ImageFont.truetype(FONT_PATH, 12)

          # ==========================================
          # GET REPOSITORY DATA
          # ==========================================

          repos = []

          for repo in PROJECTS:

              url = f"https://api.github.com/repos/{OWNER}/{repo}"

              result = subprocess.run(
                  [
                      "curl",
                      "-s",
                      "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "-H", "Accept: application/vnd.github+json",
                      url
                  ],
                  capture_output=True,
                  text=True
              )

              try:
                  data = json.loads(result.stdout)

                  if "id" in data:
                      repos.append({
                          "name": repo,
                          "status": "HEALTHY",
                          "branch": data.get("default_branch", "main")
                      })
                  else:
                      repos.append({
                          "name": repo,
                          "status": "MISSING",
                          "branch": "N/A"
                      })

              except Exception:
                  repos.append({
                      "name": repo,
                      "status": "ERROR",
                      "branch": "N/A"
                  })

          # ==========================================
          # CREATE FRAMES
          # ==========================================

          frames = []

          # Scanner positions
          scanner_positions = list(range(55, WIDTH - 55, 45))

          for frame_index, scanner_x in enumerate(scanner_positions):

              img = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  "#050505"
              )

              draw = ImageDraw.Draw(img)

              # ======================================
              # OUTER BORDER
              # ======================================

              draw.rounded_rectangle(
                  (2, 2, WIDTH - 3, HEIGHT - 3),
                  radius=22,
                  outline="#00ff88",
                  width=2
              )

              # ======================================
              # GRID
              # ======================================

              for x in range(25, WIDTH, 105):
                  draw.line(
                      (x, 0, x, HEIGHT),
                      fill="#0a241b",
                      width=1
                  )

              for y in range(25, HEIGHT, 105):
                  draw.line(
                      (0, y, WIDTH, y),
                      fill="#0a241b",
                      width=1
                  )

              # ======================================
              # HEADER
              # ======================================

              draw.text(
                  (42, 28),
                  "PROJECT HEALTH",
                  font=TITLE_FONT,
                  fill="#00ff88"
              )

              draw.text(
                  (42, 61),
                  "AUTOMATED REPOSITORY MONITOR",
                  font=SMALL_FONT,
                  fill="#666666"
              )

              draw.line(
                  (42, 99, WIDTH - 42, 99),
                  fill="#00ff88",
                  width=1
              )

              # ======================================
              # REPOSITORY CARDS
              # ======================================

              y = HEADER

              for repo in repos:

                  # Card
                  draw.rounded_rectangle(
                      (
                          42,
                          y,
                          WIDTH - 42,
                          y + CARD_HEIGHT
                      ),
                      radius=10,
                      fill="#080808",
                      outline="#242424",
                      width=1
                  )

                  # Repository name
                  draw.text(
                      (68, y + 15),
                      repo["name"],
                      font=REPO_FONT,
                      fill="#ffffff"
                  )

                  # Status
                  if repo["status"] == "HEALTHY":
                      status_color = "#00ff88"
                  elif repo["status"] == "MISSING":
                      status_color = "#ffcc00"
                  else:
                      status_color = "#ff4444"

                  # Pulsing status dot
                  pulse = (frame_index % 6)

                  radius = 5 + pulse

                  draw.ellipse(
                      (
                          545 - radius,
                          y + 22 - radius,
                          545 + radius,
                          y + 22 + radius
                      ),
                      fill=status_color
                  )

                  draw.text(
                      (568, y + 14),
                      repo["status"],
                      font=STATUS_FONT,
                      fill=status_color
                  )

                  # Branch
                  draw.text(
                      (68, y + 43),
                      f"BRANCH: {repo['branch']}",
                      font=SMALL_FONT,
                      fill="#777777"
                  )

                  y += CARD_HEIGHT + CARD_GAP

              # ======================================
              # SCANNER LINE
              # ======================================

              scan_y = HEADER - 5

              draw.line(
                  (
                      scanner_x,
                      100,
                      scanner_x,
                      HEIGHT - FOOTER
                  ),
                  fill="#00ff88",
                  width=2
              )

              # Scanner glow
              for glow in range(1, 5):
                  draw.line(
                      (
                          scanner_x - glow,
                          100,
                          scanner_x - glow,
                          HEIGHT - FOOTER
                      ),
                      fill="#063d27",
                      width=1
                  )

              # ======================================
              # FOOTER
              # ======================================

              footer_y = HEIGHT - FOOTER

              draw.line(
                  (42, footer_y, WIDTH - 42, footer_y),
                  fill="#00ff88",
                  width=1
              )

              scan_time = datetime.now(timezone.utc).strftime(
                  "%d %b %Y • %H:%M UTC"
              )

              draw.text(
                  (42, footer_y + 17),
                  f"LAST SCAN: {scan_time}",
                  font=SMALL_FONT,
                  fill="#666666"
              )

              # Monitoring indicator
              draw.ellipse(
                  (
                      WIDTH - 215,
                      footer_y + 19,
                      WIDTH - 207,
                      footer_y + 27
                  ),
                  fill="#00ff88"
              )

              draw.text(
                  (WIDTH - 195, footer_y + 17),
                  "MONITORING",
                  font=SMALL_FONT,
                  fill="#00ff88"
              )

              frames.append(img)

          # ==========================================
          # SAVE GIF
          # ==========================================

          os.makedirs("assets", exist_ok=True)

          output = "assets/project-health.gif"

          frames[0].save(
              output,
              save_all=True,
              append_images=frames[1:],
              duration=90,
              loop=0,
              optimize=True
          )

          print(f"Generated {output}")
          print(f"Size: {WIDTH}x{HEIGHT}")
          print(f"Frames: {len(frames)}")
          print(f"Repositories: {len(repos)}")
          PY
      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit project health

        run: |

          git config --global user.name \
            "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/project-health.svg


          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "chore: update project health"

            git push

          fi
