name: Project Status UI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/project-status.svg"

  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update-project-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Project Status SVG
        env:
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import html
          from pathlib import Path
          from datetime import datetime, timezone

          # --------------------------------------------------
          # Repository information
          # --------------------------------------------------

          repo = os.environ.get("REPO_NAME", "Unknown Repository")
          branch = os.environ.get("BRANCH_NAME", "main")
          event = os.environ.get("EVENT_NAME", "push")

          def git(command):
              try:
                  return subprocess.check_output(
                      command,
                      shell=True,
                      text=True,
                      stderr=subprocess.DEVNULL
                  ).strip()
              except:
                  return ""

          commit_count = git("git rev-list --count HEAD") or "0"

          latest_commit = git(
              "git log -1 --pretty=%s"
          ) or "No commits found"

          latest_author = git(
              "git log -1 --pretty=%an"
          ) or "Unknown"

          latest_sha = git(
              "git log -1 --pretty=%h"
          ) or "------"

          latest_date = git(
              "git log -1 --date=format:'%d %b %Y %H:%M' "
              "--format='%ad'"
          ) or "Unknown"

          # --------------------------------------------------
          # Repository structure detection
          # --------------------------------------------------

          def exists(path):
              return Path(path).exists()

          def has_files(directory):
              path = Path(directory)
              return path.exists() and any(path.rglob("*"))

          files = [
              p for p in Path(".").rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and "assets" not in p.parts
          ]

          file_count = len(files)

          # --------------------------------------------------
          # ML project stages
          # --------------------------------------------------

          data_progress = 0
          cleaning_progress = 0
          eda_progress = 0
          feature_progress = 0
          model_progress = 0
          evaluation_progress = 0

          # Data
          if exists("data") or exists("data/raw"):
              data_progress = 100

          # Cleaning / preprocessing
          if (
              exists("data/processed")
              or exists("notebooks/02_Preprocessing.ipynb")
              or exists("notebooks/02_Preprocessing")
          ):
              cleaning_progress = 100

          # EDA
          if (
              exists("notebooks/01_EDA.ipynb")
              or exists("notebooks/01_EDA")
              or exists("outputs/plots")
          ):
              eda_progress = 100

          # Feature engineering
          if (
              exists("notebooks/02_Preprocessing.ipynb")
              or exists("outputs/features")
              or exists("features")
          ):
              feature_progress = 85

          # Model training
          if (
              exists("notebooks/03_Model_Training.ipynb")
              or exists("models")
          ):
              model_progress = 60

          # Evaluation
          if (
              exists("notebooks/04_Model_Evaluation.ipynb")
              or exists("outputs/reports")
              or exists("outputs/evaluation")
          ):
              evaluation_progress = 40

          # --------------------------------------------------
          # Detect current focus from latest commit
          # --------------------------------------------------

          changed_files = git(
              "git diff-tree --no-commit-id --name-only -r HEAD"
          ).lower()

          commit_text = latest_commit.lower()

          focus = "Repository Development"

          if any(x in changed_files or x in commit_text for x in [
              "01_eda",
              "eda",
              "exploration",
              "visualization"
          ]):
              focus = "Exploratory Data Analysis"

          elif any(x in changed_files or x in commit_text for x in [
              "02_preprocessing",
              "preprocess",
              "clean",
              "cleaning"
          ]):
              focus = "Data Preprocessing"

          elif any(x in changed_files or x in commit_text for x in [
              "feature",
              "engineering"
          ]):
              focus = "Feature Engineering"

          elif any(x in changed_files or x in commit_text for x in [
              "03_model",
              "model_training",
              "train",
              "training",
              "models/"
          ]):
              focus = "Model Development"

          elif any(x in changed_files or x in commit_text for x in [
              "04_model_evaluation",
              "evaluation",
              "evaluate",
              "metric"
          ]):
              focus = "Model Evaluation"

          elif any(x in changed_files or x in commit_text for x in [
              "readme",
              "workflow",
              ".yml",
              ".yaml"
          ]):
              focus = "Project Infrastructure"

          # --------------------------------------------------
          # Overall progress
          # --------------------------------------------------

          stages = [
              data_progress,
              cleaning_progress,
              eda_progress,
              feature_progress,
              model_progress,
              evaluation_progress
          ]

          overall = round(sum(stages) / len(stages))

          # --------------------------------------------------
          # Escape SVG text
          # --------------------------------------------------

          def esc(value):
              return html.escape(str(value))

          # --------------------------------------------------
          # SVG
          # --------------------------------------------------

          svg = f'''<svg
          width="1000"
          height="650"
          viewBox="0 0 1000 650"
          xmlns="http://www.w3.org/2000/svg">

          <defs>

            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#050505"/>
              <stop offset="100%" stop-color="#111111"/>
            </linearGradient>

            <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#00ff88"/>
              <stop offset="100%" stop-color="#00ccff"/>
            </linearGradient>

            <filter id="glow">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <style>

              .title {{
                font-family: monospace;
                font-size: 26px;
                font-weight: bold;
                fill: #ffffff;
              }}

              .subtitle {{
                font-family: monospace;
                font-size: 13px;
                fill: #888888;
              }}

              .label {{
                font-family: monospace;
                font-size: 13px;
                fill: #bbbbbb;
              }}

              .value {{
                font-family: monospace;
                font-size: 14px;
                fill: #ffffff;
              }}

              .small {{
                font-family: monospace;
                font-size: 11px;
                fill: #777777;
              }}

              .bar {{
                fill: #222222;
              }}

              .fill {{
                fill: url(#line);
              }}

              .pulse {{
                animation: pulse 1.6s infinite;
              }}

              @keyframes pulse {{
                0%,100% {{ opacity: 1; }}
                50% {{ opacity: .35; }}
              }}

              .scan {{
                animation: scan 4s linear infinite;
              }}

              @keyframes scan {{
                0% {{ transform: translateX(0); opacity: .1; }}
                50% {{ opacity: .7; }}
                100% {{ transform: translateX(1000px); opacity: .1; }}
              }}

            </style>

          </defs>

          <!-- Background -->

          <rect width="1000" height="650" rx="18" fill="url(#bg)"/>

          <!-- Header -->

          <text x="45" y="55" class="title">
            RESTAURANT RATING PREDICTION
          </text>

          <text x="45" y="78" class="subtitle">
            AI / ML PROJECT MONITOR
          </text>

          <circle
            cx="920"
            cy="52"
            r="7"
            fill="#00ff88"
            filter="url(#glow)"
            class="pulse"
          />

          <text x="935" y="57" class="label">
            ACTIVE
          </text>

          <!-- Overall progress -->

          <text x="45" y="125" class="label">
            PROJECT PROGRESS
          </text>

          <text x="880" y="125" class="value">
            {overall}%
          </text>

          <rect
            x="45"
            y="140"
            width="910"
            height="10"
            rx="5"
            class="bar"
          />

          <rect
            x="45"
            y="140"
            width="{9.1 * overall}"
            height="10"
            rx="5"
            class="fill"
          />

          <!-- Pipeline -->

          <text x="45" y="195" class="title">
            ML PIPELINE
          </text>

          <!-- Data -->

          <text x="45" y="230" class="label">
            DATA
          </text>

          <text x="400" y="230" class="value">
            {data_progress}%
          </text>

          <rect x="45" y="240" width="400" height="8" rx="4" class="bar"/>
          <rect x="45" y="240" width="{4 * data_progress}" height="8" rx="4" class="fill"/>

          <!-- Cleaning -->

          <text x="500" y="230" class="label">
            CLEANING
          </text>

          <text x="855" y="230" class="value">
            {cleaning_progress}%
          </text>

          <rect x="500" y="240" width="400" height="8" rx="4" class="bar"/>
          <rect x="500" y="240" width="{4 * cleaning_progress}" height="8" rx="4" class="fill"/>

          <!-- EDA -->

          <text x="45" y="285" class="label">
            EDA
          </text>

          <text x="400" y="285" class="value">
            {eda_progress}%
          </text>

          <rect x="45" y="295" width="400" height="8" rx="4" class="bar"/>
          <rect x="45" y="295" width="{4 * eda_progress}" height="8" rx="4" class="fill"/>

          <!-- Features -->

          <text x="500" y="285" class="label">
            FEATURES
          </text>

          <text x="855" y="285" class="value">
            {feature_progress}%
          </text>

          <rect x="500" y="295" width="400" height="8" rx="4" class="bar"/>
          <rect x="500" y="295" width="{4 * feature_progress}" height="8" rx="4" class="fill"/>

          <!-- Model -->

          <text x="45" y="340" class="label">
            MODEL TRAINING
          </text>

          <text x="400" y="340" class="value">
            {model_progress}%
          </text>

          <rect x="45" y="350" width="400" height="8" rx="4" class="bar"/>
          <rect x="45" y="350" width="{4 * model_progress}" height="8" rx="4" class="fill"/>

          <!-- Evaluation -->

          <text x="500" y="340" class="label">
            EVALUATION
          </text>

          <text x="855" y="340" class="value">
            {evaluation_progress}%
          </text>

          <rect x="500" y="350" width="400" height="8" rx="4" class="bar"/>
          <rect x="500" y="350" width="{4 * evaluation_progress}" height="8" rx="4" class="fill"/>

          <!-- Current focus -->

          <rect
            x="45"
            y="395"
            width="910"
            height="70"
            rx="10"
            fill="#0c0c0c"
            stroke="#222222"
          />

          <text x="65" y="420" class="small">
            CURRENT FOCUS
          </text>

          <text x="65" y="447" class="value">
            {esc(focus)}
          </text>

          <!-- Repository -->

          <text x="45" y="510" class="title">
            REPOSITORY STATUS
          </text>

          <text x="45" y="540" class="label">
            REPOSITORY
          </text>

          <text x="180" y="540" class="value">
            {esc(repo)}
          </text>

          <text x="500" y="540" class="label">
            BRANCH
          </text>

          <text x="590" y="540" class="value">
            {esc(branch)}
          </text>

          <text x="45" y="565" class="label">
            COMMITS
          </text>

          <text x="180" y="565" class="value">
            {esc(commit_count)}
          </text>

          <text x="500" y="565" class="label">
            FILES
          </text>

          <text x="590" y="565" class="value">
            {esc(file_count)}
          </text>

          <text x="45" y="590" class="label">
            LAST COMMIT
          </text>

          <text x="180" y="590" class="value">
            {esc(latest_sha)}
          </text>

          <text x="500" y="590" class="label">
            EVENT
          </text>

          <text x="590" y="590" class="value">
            {esc(event)}
          </text>

          <!-- Footer -->

          <text x="45" y="625" class="small">
            {esc(latest_date)} • {esc(latest_author)}
          </text>

          <rect
            x="0"
            y="0"
            width="3"
            height="650"
            fill="#00ff88"
            opacity=".25"
            class="scan"
          />

          </svg>
          '''

          # --------------------------------------------------
          # Write SVG
          # --------------------------------------------------

          Path("assets").mkdir(exist_ok=True)

          Path("assets/project-status.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print("========================================")
          print("PROJECT STATUS UI GENERATED")
          print("========================================")
          print(f"Repository : {repo}")
          print(f"Branch     : {branch}")
          print(f"Commits    : {commit_count}")
          print(f"Files      : {file_count}")
          print(f"Focus      : {focus}")
          print(f"Progress   : {overall}%")
          print(f"Latest     : {latest_commit}")
          print("========================================")
          PY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated UI
        run: |
          git add assets/project-status.svg

          if git diff --cached --quiet; then
            echo "No UI changes detected."
            exit 0
          fi

          git commit -m "chore: update project status UI"

      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push UI
        run: |
          git push origin HEAD:main
