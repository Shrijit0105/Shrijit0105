name: Project Health Monitor

on:
  schedule:
    # Run once every day
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  project-health:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # CHECK PROJECTS
      # ==========================================

      - name: Check project repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          USERNAME="${{ github.repository_owner }}"

          mkdir -p assets

          echo "Checking repositories..."

          # --------------------------------------
          # Projects to monitor
          # --------------------------------------

          PROJECTS=(
            "Shrijit0105"
            "Covid19-Adverse-effects"
            "Restraunt_Pred"
            "Shopper_Spectrum"
            
          )

          # --------------------------------------
          # Generate project status JSON
          # --------------------------------------

          echo "{" > project-health.json

          FIRST=true

          for REPO in "${PROJECTS[@]}"
          do

            echo "Checking $REPO..."

            RESPONSE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$USERNAME/$REPO")

            if [ $? -eq 0 ]; then

              STATUS="HEALTHY"

              BRANCH=$(echo "$RESPONSE" | jq -r '.default_branch')

              UPDATED=$(echo "$RESPONSE" | jq -r '.updated_at')

            else

              STATUS="OFFLINE"

              BRANCH="N/A"

              UPDATED="N/A"

            fi


            if [ "$FIRST" = false ]; then
              echo "," >> project-health.json
            fi

            FIRST=false


            echo "\"$REPO\": {" >> project-health.json

            echo "\"status\": \"$STATUS\"," >> project-health.json

            echo "\"branch\": \"$BRANCH\"," >> project-health.json

            echo "\"updated\": \"$UPDATED\"" >> project-health.json

            echo "}" >> project-health.json

          done

          echo "}" >> project-health.json


          echo ""
          echo "================================="
          echo "PROJECT HEALTH"
          echo "================================="

          cat project-health.json


      # ==========================================
      # GENERATE SVG
      # ==========================================

    
      - name: Generate Project Health SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          from datetime import datetime, timezone

          os.makedirs("assets", exist_ok=True)

          # Get repository information
          projects = [
              "Shrijit0105"
               "Restraunt_Pred"
              "Covid19-Adverse-effects"
              "Zomato_Sentiment_Analysis"
              "Shopper_Spectrum"
          ]

          owner = "${{ github.repository_owner }}"

          repo_data = []

          for repo in projects:
              result = subprocess.run(
                  [
                      "curl", "-s",
                      "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
                      "-H", "Accept: application/vnd.github+json",
                      f"https://api.github.com/repos/{owner}/{repo}"
                  ],
                  capture_output=True,
                  text=True
              )

              try:
                  import json
                  data = json.loads(result.stdout)

                  if "id" in data:
                      repo_data.append({
                          "name": repo,
                          "status": "HEALTHY",
                          "branch": data.get("default_branch", "main"),
                          "updated": data.get("updated_at", "")
                      })
                  else:
                      repo_data.append({
                          "name": repo,
                          "status": "MISSING",
                          "branch": "N/A",
                          "updated": ""
                      })

              except Exception:
                  repo_data.append({
                      "name": repo,
                      "status": "ERROR",
                      "branch": "N/A",
                      "updated": ""
                  })

          # -------------------------------------------------
          # Dynamic layout
          # -------------------------------------------------

          WIDTH = 980

          HEADER_HEIGHT = 105
          CARD_HEIGHT = 89
          CARD_GAP = 17
          FOOTER_HEIGHT = 58
          BOTTOM_PADDING = 20

          total_cards_height = (
              len(repo_data) * CARD_HEIGHT
              + max(0, len(repo_data) - 1) * CARD_GAP
          )

          HEIGHT = (
              HEADER_HEIGHT
              + total_cards_height
              + FOOTER_HEIGHT
              + BOTTOM_PADDING
          )

          scan_time = datetime.now(timezone.utc).strftime(
              "%d %b %Y • %H:%M UTC"
          )

          # -------------------------------------------------
          # SVG
          # -------------------------------------------------

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="{WIDTH}"
          height="{HEIGHT}"
          viewBox="0 0 {WIDTH} {HEIGHT}">

          <defs>

            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <pattern id="grid"
                     width="105"
                     height="105"
                     patternUnits="userSpaceOnUse">

              <path d="M 105 0 L 0 0 0 105"
                    fill="none"
                    stroke="#00ff88"
                    stroke-opacity="0.08"
                    stroke-width="1"/>

            </pattern>

          </defs>


          <!-- BACKGROUND -->

          <rect
            width="100%"
            height="100%"
            rx="22"
            fill="#050505"
            stroke="#00ff88"
            stroke-width="2"
          />

          <rect
            x="1"
            y="1"
            width="{WIDTH-2}"
            height="{HEIGHT-2}"
            rx="21"
            fill="url(#grid)"
          />


          <!-- HEADER -->

          <text
            x="42"
            y="52"
            fill="#00ff88"
            font-family="monospace"
            font-size="23"
            font-weight="bold">
            PROJECT HEALTH
          </text>

          <text
            x="42"
            y="78"
            fill="#666"
            font-family="monospace"
            font-size="11">
            AUTOMATED REPOSITORY MONITOR
          </text>

          <line
            x1="42"
            y1="99"
            x2="{WIDTH-42}"
            y2="99"
            stroke="#00ff88"
            stroke-opacity="0.35"
          />
          '''

          # -------------------------------------------------
          # Repository cards
          # -------------------------------------------------

          y = HEADER_HEIGHT + 15

          for repo in repo_data:

              status = repo["status"]
              branch = repo["branch"]

              if status == "HEALTHY":
                  dot = "#00ff88"
                  status_text = "HEALTHY"
              elif status == "MISSING":
                  dot = "#ffcc00"
                  status_text = "MISSING"
              else:
                  dot = "#ff4444"
                  status_text = "ERROR"

              card_y = y

              svg += f'''
          <rect
            x="42"
            y="{card_y}"
            width="{WIDTH-84}"
            height="{CARD_HEIGHT}"
            rx="10"
            fill="#080808"
            stroke="#242424"
            stroke-width="1"
          />

          <text
            x="68"
            y="{card_y + 28}"
            fill="#ffffff"
            font-family="monospace"
            font-size="16">
            {repo["name"]}
          </text>

          <circle
            cx="550"
            cy="{card_y + 20}"
            r="7"
            fill="{dot}"
            filter="url(#glow)"
          />

          <text
            x="570"
            y="{card_y + 25}"
            fill="{dot}"
            font-family="monospace"
            font-size="13">
            {status_text}
          </text>

          <text
            x="68"
            y="{card_y + 55}"
            fill="#777"
            font-family="monospace"
            font-size="10">
            BRANCH: {branch}
          </text>
          '''

              y += CARD_HEIGHT + CARD_GAP

          # -------------------------------------------------
          # Footer
          # -------------------------------------------------

          footer_y = HEIGHT - 25

          svg += f'''
          <line
            x1="42"
            y1="{HEIGHT-58}"
            x2="{WIDTH-42}"
            y2="{HEIGHT-58}"
            stroke="#00ff88"
            stroke-opacity="0.25"
          />

          <text
            x="42"
            y="{footer_y}"
            fill="#666"
            font-family="monospace"
            font-size="10">
            LAST SCAN: {scan_time}
          </text>

          <circle
            cx="{WIDTH-205}"
            cy="{footer_y-4}"
            r="4"
            fill="#00ff88"
            filter="url(#glow)"
          />

          <text
            x="{WIDTH-190}"
            y="{footer_y}"
            fill="#00ff88"
            font-family="monospace"
            font-size="10">
            MONITORING
          </text>

          </svg>
          '''

          with open("assets/project-health.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print(f"Generated SVG: {WIDTH}x{HEIGHT}")
          print(f"Repositories: {len(repo_data)}")
          PY

      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit project health

        run: |

          git config --global user.name \
            "github-actions[bot]"

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/project-health.svg


          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "chore: update project health"

            git push

          fi
