name: Most Used Languages HUD

on:
  workflow_dispatch:

  schedule:
    - cron: "20 0 * * *"

  push:
    paths:
      - ".github/workflows/most-used-languages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Language HUD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import math
          import html

          USERNAME = "Shrijit0105"

          API = "https://api.github.com"

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "language-hud"
          }


          def api(url):
              req = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())


          # ==========================================================
          # GET PUBLIC REPOSITORIES
          # ==========================================================

          repos = api(
              f"{API}/users/{USERNAME}/repos"
              "?per_page=100"
              "&sort=updated"
              "&direction=desc"
          )


          # Ignore forks and archived repositories
          repos = [
              repo for repo in repos
              if not repo.get("fork", False)
              and not repo.get("archived", False)
          ]


          # ==========================================================
          # COLLECT LANGUAGE BYTES
          # ==========================================================

          language_bytes = {}


          for repo in repos:

              repo_name = repo["name"]

              try:

                  data = api(
                      f"{API}/repos/{USERNAME}/{repo_name}/languages"
                  )

                  for language, amount in data.items():

                      language_bytes[language] = (
                          language_bytes.get(language, 0)
                          + amount
                      )

              except Exception as e:

                  print(
                      f"Could not read languages for "
                      f"{repo_name}: {e}"
                  )


          # ==========================================================
          # CALCULATE PERCENTAGES
          # ==========================================================

          total_bytes = sum(language_bytes.values())

          languages = []

          if total_bytes > 0:

              for language, amount in language_bytes.items():

                  percentage = (
                      amount / total_bytes
                  ) * 100

                  # Ignore tiny statistical noise
                  languages.append(
                   (
                       language,
                       amount,
                       percentage
                          )
                    )


          languages.sort(
              key=lambda x: x[2],
              reverse=True
          )

          languages = languages[:8]


          # ==========================================================
          # LANGUAGE COLORS
          # ==========================================================

          language_colors = {

              "Python": "#3572A5",
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "C++": "#f34b7d",
              "C": "#555555",
              "Java": "#b07219",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "Shell": "#89e051",
              "Jupyter Notebook": "#DA5B0B",
              "PHP": "#4F5D95",
              "Go": "#00ADD8",
              "Rust": "#dea584",
              "Kotlin": "#A97BFF",
              "Dart": "#00B4AB",
              "Ruby": "#701516"

          }


          # ==========================================================
          # SVG SETTINGS
          # ==========================================================

          WIDTH = 1100

          ROW_HEIGHT = 68

          HEIGHT = 170 + len(languages) * ROW_HEIGHT + 90

          os.makedirs("assets", exist_ok=True)


          # ==========================================================
          # GENERATE LANGUAGE NODES
          # ==========================================================

          rows = ""

          for i, (language, amount, percentage) in enumerate(languages):

              y = 190 + i * ROW_HEIGHT

              color = language_colors.get(
                  language,
                  "#60a5fa"
              )

              safe_language = html.escape(language)

              bar_width = 430 * (
                  percentage / 100
              )

              # Every row has its own animation delay
              delay = i * 0.18

              rows += f"""

              <!-- LANGUAGE ROW {i} -->

              <g>

                <!-- percentage ring -->

                <circle
                  cx="65"
                  cy="{y}"
                  r="22"
                  fill="none"
                  stroke="#102b3d"
                  stroke-width="4"/>


                <circle
                  cx="65"
                  cy="{y}"
                  r="22"
                  fill="none"
                  stroke="{color}"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-dasharray="138"
                  stroke-dashoffset="138"
                  transform="rotate(-90 65 {y})">

                  <animate
                    attributeName="stroke-dashoffset"
                    from="138"
                    to="{138 - (138 * percentage / 100)}"
                    dur="1.2s"
                    begin="{delay}s"
                    fill="freeze"/>

                </circle>


                <!-- language name -->

                <text
                  x="105"
                  y="{y + 5}"
                  fill="#f8fafc"
                  font-family="monospace"
                  font-size="15"
                  font-weight="bold"
                  letter-spacing="1">

                  {safe_language}

                </text>


                <!-- data track -->

                <line
                  x1="280"
                  y1="{y}"
                  x2="710"
                  y2="{y}"
                  stroke="#102b3d"
                  stroke-width="3"/>


                <!-- growing data bar -->

                <rect
                  x="280"
                  y="{y - 3}"
                  width="0"
                  height="6"
                  rx="3"
                  fill="{color}">

                  <animate
                    attributeName="width"
                    from="0"
                    to="{bar_width}"
                    dur="1.4s"
                    begin="{delay}s"
                    fill="freeze"/>

                </rect>


                <!-- moving data particle -->

                <circle
                  cx="280"
                  cy="{y}"
                  r="3"
                  fill="{color}">

                  <animate
                    attributeName="cx"
                    from="280"
                    to="{280 + bar_width}"
                    dur="1.4s"
                    begin="{delay}s"
                    fill="freeze"/>

                  <animate
                    attributeName="r"
                    values="2;5;2"
                    dur="1.4s"
                    begin="{delay}s"
                    fill="freeze"/>

                </circle>


                <!-- percentage -->

                <text
                  x="760"
                  y="{y + 5}"
                  fill="{color}"
                  font-family="monospace"
                  font-size="15"
                  font-weight="bold">

                  {percentage:.1f}%

                </text>


                <!-- byte count -->

                <text
                  x="1035"
                  y="{y + 5}"
                  text-anchor="end"
                  fill="#64748b"
                  font-family="monospace"
                  font-size="10">

                  {amount:,} BYTES

                </text>

              </g>
              """


          # ==========================================================
          # EMPTY STATE
          # ==========================================================

          if not languages:

              rows = """
              <text
                x="550"
                y="280"
                text-anchor="middle"
                fill="#64748b"
                font-family="monospace"
                font-size="14">

                NO LANGUAGE DATA AVAILABLE

              </text>
              """


          # ==========================================================
          # SVG
          # ==========================================================

          svg = f"""<?xml version="1.0" encoding="UTF-8"?>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}">


            <defs>

              <!-- Background grid -->

              <pattern
                id="grid"
                width="40"
                height="40"
                patternUnits="userSpaceOnUse">

                <path
                  d="M40 0H0V40"
                  fill="none"
                  stroke="#0b202d"
                  stroke-width="1"/>

              </pattern>


              <!-- Soft glow -->

              <filter id="glow">

                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"/>

                <feMerge>

                  <feMergeNode in="blur"/>

                  <feMergeNode in="SourceGraphic"/>

                </feMerge>

              </filter>


              <!-- Gradient -->

              <linearGradient
                id="headerLine"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

                <stop
                  offset="0%"
                  stop-color="#ef4444"/>

                <stop
                  offset="50%"
                  stop-color="#60a5fa"/>

                <stop
                  offset="100%"
                  stop-color="#ef4444"/>

              </linearGradient>

            </defs>


            <!-- ================================================= -->
            <!-- BACKGROUND -->
            <!-- ================================================= -->

            <rect
              width="100%"
              height="100%"
              fill="#05080d"/>

            <rect
              width="100%"
              height="100%"
              fill="url(#grid)"
              opacity="0.45"/>


            <!-- ================================================= -->
            <!-- FRAME -->
            <!-- ================================================= -->

            <rect
              x="18"
              y="18"
              width="{WIDTH - 36}"
              height="{HEIGHT - 36}"
              rx="18"
              fill="none"
              stroke="#143a52"
              stroke-width="2"/>


            <!-- ================================================= -->
            <!-- HEADER -->
            <!-- ================================================= -->

            <text
              x="55"
              y="62"
              fill="#ef4444"
              font-family="monospace"
              font-size="13"
              font-weight="bold"
              letter-spacing="3">

              LANGUAGE MATRIX

            </text>


            <text
              x="1045"
              y="62"
              text-anchor="end"
              fill="#60a5fa"
              font-family="monospace"
              font-size="11"
              letter-spacing="2">

              LIVE REPOSITORY ANALYSIS

            </text>


            <line
              x1="55"
              y1="82"
              x2="1045"
              y2="82"
              stroke="url(#headerLine)"
              stroke-width="2"/>


            <!-- ================================================= -->
            <!-- SUMMARY -->
            <!-- ================================================= -->

            <text
              x="55"
              y="115"
              fill="#64748b"
              font-family="monospace"
              font-size="10"
              letter-spacing="2">

              LANGUAGES DETECTED

            </text>


            <text
              x="55"
              y="145"
              fill="#f8fafc"
              font-family="monospace"
              font-size="25"
              font-weight="bold">

              {len(languages)}

            </text>


            <text
              x="250"
              y="115"
              fill="#64748b"
              font-family="monospace"
              font-size="10"
              letter-spacing="2">

              REPOSITORIES SCANNED

            </text>


            <text
              x="250"
              y="145"
              fill="#60a5fa"
              font-family="monospace"
              font-size="25"
              font-weight="bold">

              {len(repos)}

            </text>


            <text
              x="500"
              y="115"
              fill="#64748b"
              font-family="monospace"
              font-size="10"
              letter-spacing="2">

              DATA POINTS

            </text>


            <text
              x="500"
              y="145"
              fill="#ef4444"
              font-family="monospace"
              font-size="25"
              font-weight="bold">

              {total_bytes:,}

            </text>


            <!-- ================================================= -->
            <!-- LANGUAGE DATA -->
            <!-- ================================================= -->

            {rows}


            <!-- ================================================= -->
            <!-- FOOTER -->
            <!-- ================================================= -->

            <line
              x1="55"
              y1="{HEIGHT - 65}"
              x2="1045"
              y2="{HEIGHT - 65}"
              stroke="#143a52"/>


            <circle
              cx="70"
              cy="{HEIGHT - 40}"
              r="4"
              fill="#22c55e">

              <animate
                attributeName="r"
                values="3;6;3"
                dur="2s"
                repeatCount="indefinite"/>

              <animate
                attributeName="opacity"
                values="1;0.35;1"
                dur="2s"
                repeatCount="indefinite"/>

            </circle>


            <text
              x="85"
              y="{HEIGHT - 36}"
              fill="#22c55e"
              font-family="monospace"
              font-size="10"
              letter-spacing="2">

              REPOSITORY TELEMETRY ACTIVE

            </text>


            <text
              x="1045"
              y="{HEIGHT - 36}"
              text-anchor="end"
              fill="#475569"
              font-family="monospace"
              font-size="10">

              GITHUB LINGUIST DATA

            </text>


            <!-- ================================================= -->
            <!-- DECORATIVE ORBIT -->
            <!-- ================================================= -->

            <g
              transform="translate(1000 125)">

              <circle
                r="28"
                fill="none"
                stroke="#143a52"
                stroke-width="1"/>

              <circle
                r="18"
                fill="none"
                stroke="#60a5fa"
                stroke-width="1"
                stroke-dasharray="4 5">

                <animateTransform
                  attributeName="transform"
                  type="rotate"
                  from="0"
                  to="360"
                  dur="8s"
                  repeatCount="indefinite"/>

              </circle>

              <circle
                cx="18"
                cy="0"
                r="3"
                fill="#ef4444">

                <animateTransform
                  attributeName="transform"
                  type="rotate"
                  from="0"
                  to="360"
                  dur="4s"
                  repeatCount="indefinite"/>

              </circle>

            </g>

          </svg>
          """


          with open(
              "assets/most-used-languages.svg",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(svg)


          print("Most Used Languages HUD generated.")

          print(
              "Languages:",
              [(x[0], round(x[2], 2)) for x in languages]
          )

          PY


      - name: Commit generated HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/most-used-languages.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update language matrix HUD"
          git push
