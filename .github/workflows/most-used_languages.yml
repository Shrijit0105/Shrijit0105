name: Most Used Languages HUD

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/most-used-languages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout profile repository
        uses: actions/checkout@v5


      # ============================================================
      # GENERATE LANGUAGE HUD
      # ============================================================

      - name: Analyze GitHub languages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: python
        run: |

          import json
          import html
          import os
          import urllib.request
          from pathlib import Path


          # ========================================================
          # CONFIG
          # ========================================================

          USERNAME = "Shrijit0105"

          API = "https://api.github.com"

          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Shrijit0105-Language-HUD"
          }


          # ========================================================
          # GITHUB API HELPER
          # ========================================================

          def github_get(url):

              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              with urllib.request.urlopen(request) as response:

                  return json.loads(
                      response.read().decode()
                  )


          # ========================================================
          # GET PUBLIC REPOSITORIES
          # ========================================================

          repos_url = (
              f"{API}/users/{USERNAME}/repos"
              "?per_page=100"
              "&sort=updated"
              "&direction=desc"
          )

          repos = github_get(
              repos_url
          )


          # ========================================================
          # FILTER REPOSITORIES
          # ========================================================

          repos = [

              repo

              for repo in repos

              if not repo.get("fork", False)

              and not repo.get("archived", False)

          ]


          # ========================================================
          # LANGUAGE BYTE COUNTER
          # ========================================================

          language_bytes = {}


          # ========================================================
          # SCAN EACH REPOSITORY
          # ========================================================

          for repo in repos:

              repo_name = repo["name"]

              print(
                  f"Scanning: {repo_name}"
              )

              languages_url = (
                  f"{API}/repos/"
                  f"{USERNAME}/"
                  f"{repo_name}/languages"
              )

              try:

                  languages = github_get(
                      languages_url
                  )

              except Exception as error:

                  print(
                      f"Could not read {repo_name}: {error}"
                  )

                  continue


              # ----------------------------------------------------
              # AGGREGATE BYTES
              # ----------------------------------------------------

              for language, byte_count in languages.items():

                  language_bytes[language] = (
                      language_bytes.get(
                          language,
                          0
                      )
                      + byte_count
                  )


          # ========================================================
          # SORT LANGUAGES
          # ========================================================

          sorted_languages = sorted(
              language_bytes.items(),
              key=lambda item: item[1],
              reverse=True
          )


          # ========================================================
          # TOTAL BYTES
          # ========================================================

          total_bytes = sum(
              language_bytes.values()
          )


          # ========================================================
          # SELECT TOP LANGUAGES
          # ========================================================

          top_languages = []

          if total_bytes > 0:

              for language, byte_count in sorted_languages:

                  percentage = (
                      byte_count
                      / total_bytes
                      * 100
                  )

                  # Ignore tiny language traces.
                  if percentage < 1:

                      continue

                  top_languages.append(
                      (
                          language,
                          byte_count,
                          percentage
                      )
                  )

                  if len(top_languages) >= 8:

                      break


          # ========================================================
          # HANDLE EMPTY RESULT
          # ========================================================

          if not top_languages:

              top_languages = [
                  (
                      "No data",
                      1,
                      100
                  )
              ]


          # ========================================================
          # PRINT RESULTS
          # ========================================================

          print()
          print(
              "=========================================="
          )

          print(
              "MOST USED LANGUAGES"
          )

          print(
              "=========================================="
          )

          for language, byte_count, percentage in top_languages:

              print(
                  f"{language}: "
                  f"{percentage:.2f}% "
                  f"({byte_count:,} bytes)"
              )

          print(
              "=========================================="
          )


          # ========================================================
          # XML ESCAPE
          # ========================================================

          escaped_languages = [

              (
                  html.escape(language),
                  byte_count,
                  percentage
              )

              for language, byte_count, percentage
              in top_languages

          ]


          # ========================================================
          # LANGUAGE ROWS
          # ========================================================

          rows = []

          start_y = 145

          row_gap = 62

          max_bar_width = 560


          for index, (
              language,
              byte_count,
              percentage
          ) in enumerate(escaped_languages):

              y = (
                  start_y
                  + index * row_gap
              )

              bar_width = max(
                  5,
                  int(
                      max_bar_width
                      * percentage
                      / 100
                  )
              )


              rows.append(
                  f"""
                  <!-- LANGUAGE {index + 1} -->

                  <text
                    x="60"
                    y="{y}"
                    fill="#d7ffea"
                    font-family="monospace"
                    font-size="13"
                    font-weight="700"
                  >
                    {language}
                  </text>


                  <text
                    x="900"
                    y="{y}"
                    text-anchor="end"
                    fill="#00ff88"
                    font-family="monospace"
                    font-size="12"
                    font-weight="700"
                  >
                    {percentage:.1f}%
                  </text>


                  <rect
                    x="60"
                    y="{y + 15}"
                    width="{max_bar_width}"
                    height="12"
                    rx="6"
                    fill="#0b1b14"
                    stroke="#00ff88"
                    stroke-opacity="0.20"
                  />


                  <rect
                    x="60"
                    y="{y + 15}"
                    width="0"
                    height="12"
                    rx="6"
                    fill="url(#hudGradient)"
                    filter="url(#glow)"
                  >

                    <animate
                      attributeName="width"
                      from="0"
                      to="{bar_width}"
                      dur="1.3s"
                      begin="{index * 0.12}s"
                      fill="freeze"
                    />

                  </rect>


                  <!-- BAR SCANNER -->

                  <rect
                    x="60"
                    y="{y + 15}"
                    width="55"
                    height="12"
                    rx="6"
                    fill="#ffffff"
                    opacity="0.16"
                  >

                    <animate
                      attributeName="x"
                      values="60;{60 + max(bar_width - 55, 0)};60"
                      dur="2.6s"
                      begin="{index * 0.12}s"
                      repeatCount="indefinite"
                    />

                  </rect>


                  <text
                    x="640"
                    y="{y + 25}"
                    fill="#35694f"
                    font-family="monospace"
                    font-size="9"
                  >
                    {byte_count:,} BYTES
                  </text>
                  """
              )


          rows_svg = "".join(
              rows
          )


          # ========================================================
          # DYNAMIC HEIGHT
          # ========================================================

          language_count = len(
              escaped_languages
          )

          height = max(
              360,
              150
              + language_count * row_gap
              + 90
          )


          # ========================================================
          # SVG
          # ========================================================

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="980"
            height="{height}"
            viewBox="0 0 980 {height}"
          >

            <defs>

              <linearGradient
                id="hudGradient"
                x1="0"
                y1="0"
                x2="1"
                y2="0"
              >

                <stop
                  offset="0%"
                  stop-color="#00ff88"
                />

                <stop
                  offset="100%"
                  stop-color="#00ffaa"
                />

              </linearGradient>


              <filter id="glow">

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>

                  <feMergeNode in="blur"/>

                  <feMergeNode
                    in="SourceGraphic"
                  />

                </feMerge>

              </filter>

            </defs>


            <!-- ================================================= -->
            <!-- BACKGROUND -->
            <!-- ================================================= -->

            <rect
              width="100%"
              height="100%"
              rx="14"
              fill="#050807"
            />


            <!-- ================================================= -->
            <!-- BORDER -->
            <!-- ================================================= -->

            <rect
              x="1"
              y="1"
              width="978"
              height="{height - 2}"
              rx="14"
              fill="none"
              stroke="#00ff88"
              stroke-opacity="0.35"
            >

              <animate
                attributeName="stroke-opacity"
                values="0.25;0.55;0.25"
                dur="3s"
                repeatCount="indefinite"
              />

            </rect>


            <!-- ================================================= -->
            <!-- HEADER -->
            <!-- ================================================= -->

            <text
              x="55"
              y="43"
              fill="#00ff88"
              font-family="monospace"
              font-size="18"
              font-weight="700"
              letter-spacing="2"
            >
              MOST USED LANGUAGES
            </text>


            <text
              x="925"
              y="43"
              text-anchor="end"
              fill="#35694f"
              font-family="monospace"
              font-size="10"
              letter-spacing="1"
            >
              AUTO DETECTED
            </text>


            <!-- ================================================= -->
            <!-- SCANNER -->
            <!-- ================================================= -->

            <rect
              x="40"
              y="70"
              width="900"
              height="1"
              fill="#00ff88"
              opacity="0.12"
            />


            <rect
              x="40"
              y="69"
              width="120"
              height="2"
              fill="#00ff88"
              filter="url(#glow)"
            >

              <animate
                attributeName="x"
                values="40;820;40"
                dur="4s"
                repeatCount="indefinite"
              />

            </rect>


            <!-- ================================================= -->
            <!-- DESCRIPTION -->
            <!-- ================================================= -->

            <text
              x="55"
              y="102"
              fill="#4d9975"
              font-family="monospace"
              font-size="10"
              letter-spacing="1"
            >
              AGGREGATED ACROSS PUBLIC NON-FORK REPOSITORIES
            </text>


            <!-- ================================================= -->
            <!-- LANGUAGE ROWS -->
            <!-- ================================================= -->

            {rows_svg}


            <!-- ================================================= -->
            <!-- FOOTER -->
            <!-- ================================================= -->

            <line
              x1="55"
              y1="{height - 55}"
              x2="925"
              y2="{height - 55}"
              stroke="#00ff88"
              stroke-opacity="0.15"
            />


            <text
              x="55"
              y="{height - 28}"
              fill="#35694f"
              font-family="monospace"
              font-size="9"
              letter-spacing="1"
            >
              LANGUAGE TELEMETRY ONLINE
            </text>


            <text
              x="925"
              y="{height - 28}"
              text-anchor="end"
              fill="#35694f"
              font-family="monospace"
              font-size="9"
            >
              TOP {language_count} LANGUAGES
            </text>

          </svg>
          """


          # ========================================================
          # WRITE SVG
          # ========================================================

          output = Path(
              "assets/most-used-languages.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )


          print()
          print(
              f"Generated {output}"
          )


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit language HUD
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/most-used-languages.svg

          if git diff --cached --quiet; then

            echo "No language changes detected."

            exit 0

          fi

          git commit \
            -m "Update most used languages HUD"

          git push
