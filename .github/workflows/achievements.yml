name: Developer Achievement System

on:
  schedule:
    - cron: "45 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  achievements:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Achievement HUD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta
          from xml.sax.saxutils import escape

          # ============================================================
          # CONFIGURATION
          # ============================================================

          USERNAME = "Shrijit0105"

          WIDTH = 980

          HEADER_HEIGHT = 120
          ACHIEVEMENT_HEIGHT = 64
          ACHIEVEMENT_GAP = 10
          PROGRESS_HEIGHT = 150
          FOOTER_HEIGHT = 70
          PADDING = 25

          ACHIEVEMENT_COUNT = 10

          HEIGHT = (
              HEADER_HEIGHT
              + ACHIEVEMENT_COUNT * ACHIEVEMENT_HEIGHT
              + (ACHIEVEMENT_COUNT - 1) * ACHIEVEMENT_GAP
              + PROGRESS_HEIGHT
              + FOOTER_HEIGHT
              + PADDING
          )

          TOKEN = os.environ["GH_TOKEN"]

          # ============================================================
          # GITHUB API
          # ============================================================

          def github_request(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Developer-Achievement-System"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      return json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as error:

                  print(
                      f"GitHub API error {error.code}: {url}"
                  )

                  return None

              except Exception as error:

                  print(
                      f"Request error: {error}"
                  )

                  return None

          # ============================================================
          # USER DATA
          # ============================================================

          user = github_request(
              f"https://api.github.com/users/{USERNAME}"
          )

          if user is None:
              raise RuntimeError(
                  "Unable to retrieve GitHub user data."
              )

          public_repos = user.get(
              "public_repos",
              0
          )

          # ============================================================
          # REPOSITORIES
          # ============================================================

          repos = github_request(
              f"https://api.github.com/users/{USERNAME}/repos"
              "?per_page=100"
          )

          if repos is None:
              repos = []

          repo_count = len(repos)

          # ============================================================
          # LANGUAGE DETECTION
          # ============================================================

          languages = set()

          for repo in repos:

              language = repo.get(
                  "language"
              )

              if language:
                  languages.add(language)

          language_count = len(languages)

          # ============================================================
          # PUBLIC EVENTS
          # ============================================================

          events = github_request(
              f"https://api.github.com/users/{USERNAME}/events"
              "?per_page=100"
          )

          if events is None:
              events = []

          # ============================================================
          # EVENT ANALYSIS
          # ============================================================

          commit_count = 0
          pull_requests = 0
          issues = 0

          activity_dates = set()

          external_repo_activity = False

          for event in events:

              event_type = event.get(
                  "type",
                  ""
              )

              payload = event.get(
                  "payload",
                  {}
              )

              # --------------------------------------------------------
              # COMMITS
              # --------------------------------------------------------

              if event_type == "PushEvent":

                  commits = payload.get(
                      "commits",
                      []
                  )

                  commit_count += len(
                      commits
                  )

              # --------------------------------------------------------
              # PULL REQUESTS
              # --------------------------------------------------------

              elif event_type == "PullRequestEvent":

                  pull_requests += 1

              # --------------------------------------------------------
              # ISSUES
              # --------------------------------------------------------

              elif event_type == "IssuesEvent":

                  issues += 1

              # --------------------------------------------------------
              # ACTIVITY DATES
              # --------------------------------------------------------

              created_at = event.get(
                  "created_at"
              )

              if created_at:

                  try:

                      dt = datetime.fromisoformat(
                          created_at.replace(
                              "Z",
                              "+00:00"
                          )
                      )

                      activity_dates.add(
                          dt.date()
                      )

                  except Exception:
                      pass

              # --------------------------------------------------------
              # OPEN SOURCE DETECTION
              # --------------------------------------------------------

              event_repo = event.get(
                  "repo",
                  {}
              ).get(
                  "name",
                  ""
              )

              if event_repo:

                  expected_prefix = (
                      USERNAME.lower()
                      + "/"
                  )

                  if not event_repo.lower().startswith(
                      expected_prefix
                  ):

                      external_repo_activity = True

          # ============================================================
          # STREAK
          # ============================================================

          today = datetime.now(
              timezone.utc
          ).date()

          streak = 0

          current_day = today

          while current_day in activity_dates:

              streak += 1

              current_day = (
                  current_day
                  - timedelta(days=1)
              )

          # ============================================================
          # ACHIEVEMENTS
          # ============================================================

          achievements = []

          def add_achievement(
              name,
              description,
              unlocked
          ):

              achievements.append({
                  "name": name,
                  "description": description,
                  "unlocked": unlocked
              })

          add_achievement(
              "FIRST COMMIT",
              "Created your first commit",
              commit_count >= 1
          )

          add_achievement(
              "FIRST REPOSITORY",
              "Created your first repository",
              repo_count >= 1
          )

          add_achievement(
              "MULTI REPO",
              "Built 3 or more repositories",
              repo_count >= 3
          )

          add_achievement(
              "MULTI LANGUAGE",
              "Used 3 or more languages",
              language_count >= 3
          )

          add_achievement(
              "100 COMMITS",
              "Reached 100 observed commits",
              commit_count >= 100
          )

          add_achievement(
              "500 COMMITS",
              "Reached 500 observed commits",
              commit_count >= 500
          )

          add_achievement(
              "FIRST PR",
              "Created or updated a pull request",
              pull_requests >= 1
          )

          add_achievement(
              "ISSUE TRACKER",
              "Created or updated an issue",
              issues >= 1
          )

          add_achievement(
              "OPEN SOURCE",
              "Activity detected outside your repositories",
              external_repo_activity
          )

          add_achievement(
              "7 DAY STREAK",
              "Maintained activity for 7 consecutive days",
              streak >= 7
          )

          # ============================================================
          # PROGRESS
          # ============================================================

          unlocked_count = sum(
              1
              for achievement in achievements
              if achievement["unlocked"]
          )

          progress = int(
              (
                  unlocked_count
                  / len(achievements)
              ) * 100
          )

          # Simple profile level

          level = max(
              1,
              unlocked_count
          )

          # ============================================================
          # SVG HELPERS
          # ============================================================

          def esc(value):
              return escape(
                  str(value)
              )

          svg = []

          # ============================================================
          # SVG ROOT
          # ============================================================

          svg.append(
              f'''<svg
              xmlns="http://www.w3.org/2000/svg"
              width="{WIDTH}"
              height="{HEIGHT}"
              viewBox="0 0 {WIDTH} {HEIGHT}">'''
          )

          # ============================================================
          # DEFINITIONS
          # ============================================================

          svg.append(f'''
          <defs>

            <linearGradient
              id="bg"
              x1="0"
              y1="0"
              x2="1"
              y2="1">

              <stop
                offset="0%"
                stop-color="#05090d"/>

              <stop
                offset="55%"
                stop-color="#07130e"/>

              <stop
                offset="100%"
                stop-color="#030607"/>

            </linearGradient>

            <linearGradient
              id="scanner"
              x1="0"
              y1="0"
              x2="1"
              y2="0">

              <stop
                offset="0%"
                stop-color="#00ff88"
                stop-opacity="0"/>

              <stop
                offset="50%"
                stop-color="#00ff88"
                stop-opacity="0.75"/>

              <stop
                offset="100%"
                stop-color="#00ff88"
                stop-opacity="0"/>

            </linearGradient>

            <clipPath id="clip">

              <rect
                x="2"
                y="2"
                width="{WIDTH - 4}"
                height="{HEIGHT - 4}"
                rx="22"/>

            </clipPath>

          </defs>
          ''')

          # ============================================================
          # BACKGROUND
          # ============================================================

          svg.append(f'''
          <rect
            x="2"
            y="2"
            width="{WIDTH - 4}"
            height="{HEIGHT - 4}"
            rx="22"
            fill="url(#bg)"
            stroke="#00ff88"
            stroke-opacity="0.35"
            stroke-width="2"/>
          ''')

          # ============================================================
          # GRID
          # ============================================================

          grid = []

          for x in range(
              40,
              WIDTH,
              40
          ):

              grid.append(
                  f'''
                  <line
                    x1="{x}"
                    y1="0"
                    x2="{x}"
                    y2="{HEIGHT}"
                    stroke="#00ff88"
                    stroke-opacity="0.035"/>
                  '''
              )

          for y in range(
              40,
              HEIGHT,
              40
          ):

              grid.append(
                  f'''
                  <line
                    x1="0"
                    y1="{y}"
                    x2="{WIDTH}"
                    y2="{y}"
                    stroke="#00ff88"
                    stroke-opacity="0.035"/>
                  '''
              )

          svg.append(
              '<g clip-path="url(#clip)">'
              + "".join(grid)
              + '</g>'
          )

          # ============================================================
          # HEADER
          # ============================================================

          svg.append('''
          <text
            x="42"
            y="48"
            fill="#00ff88"
            font-family="monospace"
            font-size="24"
            font-weight="bold"
            letter-spacing="2">
            ACHIEVEMENT SYSTEM
          </text>
          ''')

          svg.append('''
          <text
            x="43"
            y="76"
            fill="#8aa89a"
            font-family="monospace"
            font-size="12"
            letter-spacing="1">
            DEVELOPER PROGRESSION TELEMETRY
          </text>
          ''')

          # ============================================================
          # ONLINE INDICATOR
          # ============================================================

          svg.append('''
          <circle
            cx="870"
            cy="49"
            r="6"
            fill="#00ff88">

            <animate
              attributeName="r"
              values="5;9;5"
              dur="1.8s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

            <animate
              attributeName="opacity"
              values="0.45;1;0.45"
              dur="1.8s"
              repeatCount="indefinite"/>

          </circle>
          ''')

          svg.append('''
          <text
            x="890"
            y="54"
            fill="#00ff88"
            font-family="monospace"
            font-size="10"
            letter-spacing="1">
            TRACKING
          </text>
          ''')

          # ============================================================
          # ACHIEVEMENT CARDS
          # ============================================================

          start_y = HEADER_HEIGHT

          card_x = 35
          card_width = WIDTH - 70

          for index, achievement in enumerate(
              achievements
          ):

              y = (
                  start_y
                  + index * (
                      ACHIEVEMENT_HEIGHT
                      + ACHIEVEMENT_GAP
                  )
              )

              unlocked = achievement[
                  "unlocked"
              ]

              if unlocked:

                  status = "UNLOCKED"
                  status_color = "#00ff88"
                  text_color = "#dffff0"
                  border_opacity = "0.25"

              else:

                  status = "LOCKED"
                  status_color = "#56645b"
                  text_color = "#68766d"
                  border_opacity = "0.10"

              # Card

              svg.append(f'''
              <rect
                x="{card_x}"
                y="{y}"
                width="{card_width}"
                height="{ACHIEVEMENT_HEIGHT}"
                rx="12"
                fill="#07100d"
                stroke="#00ff88"
                stroke-opacity="{border_opacity}"/>
              ''')

              # Status dot

              svg.append(f'''
              <circle
                cx="61"
                cy="{y + 32}"
                r="6"
                fill="{status_color}">
              ''')

              if unlocked:

                  svg.append('''
                    <animate
                      attributeName="r"
                      values="5;8;5"
                      dur="2s"
                      begin="0s"
                      repeatCount="indefinite"
                      calcMode="spline"
                      keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
                  ''')

                  svg.append('''
                    <animate
                      attributeName="opacity"
                      values="0.5;1;0.5"
                      dur="2s"
                      repeatCount="indefinite"/>
                  ''')

              svg.append(
                  "</circle>"
              )

              # Achievement name

              svg.append(f'''
              <text
                x="84"
                y="{y + 27}"
                fill="{text_color}"
                font-family="monospace"
                font-size="14"
                font-weight="bold">
                {esc(achievement["name"])}
              </text>
              ''')

              # Description

              svg.append(f'''
              <text
                x="84"
                y="{y + 47}"
                fill="#718479"
                font-family="monospace"
                font-size="10">
                {esc(achievement["description"])}
              </text>
              ''')

              # Status

              svg.append(f'''
              <text
                x="{WIDTH - 60}"
                y="{y + 35}"
                fill="{status_color}"
                font-family="monospace"
                font-size="10"
                font-weight="bold"
                text-anchor="end"
                letter-spacing="1">
                {status}
              </text>
              ''')

          # ============================================================
          # PROGRESS SECTION
          # ============================================================

          progress_y = (
              start_y
              + ACHIEVEMENT_COUNT * ACHIEVEMENT_HEIGHT
              + (ACHIEVEMENT_COUNT - 1)
              * ACHIEVEMENT_GAP
              + 25
          )

          svg.append(f'''
          <text
            x="42"
            y="{progress_y + 25}"
            fill="#00ff88"
            font-family="monospace"
            font-size="14"
            font-weight="bold"
            letter-spacing="1">
            DEVELOPER PROGRESS
          </text>
          ''')

          svg.append(f'''
          <text
            x="{WIDTH - 42}"
            y="{progress_y + 25}"
            fill="#b9d7c4"
            font-family="monospace"
            font-size="13"
            text-anchor="end">
            LEVEL {level}
          </text>
          ''')

          # Progress background

          progress_width = WIDTH - 84

          svg.append(f'''
          <rect
            x="42"
            y="{progress_y + 45}"
            width="{progress_width}"
            height="18"
            rx="9"
            fill="#07100d"
            stroke="#00ff88"
            stroke-opacity="0.15"/>
          ''')

          # Progress fill

          filled_width = int(
              progress_width
              * progress
              / 100
          )

          svg.append(f'''
          <rect
            x="42"
            y="{progress_y + 45}"
            width="{filled_width}"
            height="18"
            rx="9"
            fill="#00ff88"
            opacity="0.55">

            <animate
              attributeName="opacity"
              values="0.35;0.7;0.35"
              dur="3s"
              repeatCount="indefinite"/>

          </rect>
          ''')

          svg.append(f'''
          <text
            x="{WIDTH / 2}"
            y="{progress_y + 95}"
            fill="#8aa89a"
            font-family="monospace"
            font-size="11"
            text-anchor="middle"
            letter-spacing="1">
            {unlocked_count}/{len(achievements)}
            ACHIEVEMENTS UNLOCKED
            // {progress}%
          </text>
          ''')

          # ============================================================
          # SCANNER
          # ============================================================

          scanner_top = 110
          scanner_height = (
              progress_y
              - scanner_top
          )

          svg.append(f'''
          <g clip-path="url(#clip)">

            <rect
              x="35"
              y="{scanner_top}"
              width="18"
              height="{scanner_height}"
              fill="url(#scanner)"
              opacity="0.16">

              <animate
                attributeName="x"
                values="35;927;35"
                dur="5s"
                repeatCount="indefinite"
                calcMode="spline"
                keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

            </rect>

            <rect
              x="43"
              y="{scanner_top}"
              width="2"
              height="{scanner_height}"
              fill="#00ff88"
              opacity="0.75">

              <animate
                attributeName="x"
                values="43;935;43"
                dur="5s"
                repeatCount="indefinite"
                calcMode="spline"
                keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

            </rect>

          </g>
          ''')

          # ============================================================
          # FOOTER
          # ============================================================

          footer_y = (
              progress_y
              + PROGRESS_HEIGHT
          )

          svg.append(f'''
          <line
            x1="42"
            y1="{footer_y}"
            x2="{WIDTH - 42}"
            y2="{footer_y}"
            stroke="#00ff88"
            stroke-opacity="0.15"/>
          ''')

          svg.append(f'''
          <text
            x="42"
            y="{footer_y + 32}"
            fill="#63796d"
            font-family="monospace"
            font-size="10">
            ACHIEVEMENT ENGINE // GITHUB TELEMETRY
          </text>
          ''')

          svg.append(f'''
          <text
            x="{WIDTH - 42}"
            y="{footer_y + 32}"
            fill="#63796d"
            font-family="monospace"
            font-size="10"
            text-anchor="end">
            AUTO-SCAN // DAILY
          </text>
          ''')

          # ============================================================
          # BORDER PULSE
          # ============================================================

          svg.append(f'''
          <rect
            x="3"
            y="3"
            width="{WIDTH - 6}"
            height="{HEIGHT - 6}"
            rx="21"
            fill="none"
            stroke="#00ff88"
            stroke-width="1"
            stroke-opacity="0.2">

            <animate
              attributeName="stroke-opacity"
              values="0.15;0.42;0.15"
              dur="3.5s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>

          </rect>
          ''')

          # ============================================================
          # CLOSE SVG
          # ============================================================

          svg.append("</svg>")

          # ============================================================
          # WRITE FILE
          # ============================================================

          os.makedirs(
              "assets",
              exist_ok=True
          )

          with open(
              "assets/achievements.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "\n".join(svg)
              )

          print(
              f"Generated achievements.svg "
              f"({WIDTH}x{HEIGHT})"
          )

          print(
              f"Unlocked: {unlocked_count}/{len(achievements)}"
          )

          print(
              f"Progress: {progress}%"
          )

          print(
              f"Level: {level}"
          )

          PY

      - name: Commit Achievement HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/achievements.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update developer achievement HUD"
            git push
          fi
