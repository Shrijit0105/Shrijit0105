
name: GitHub Activity Command Centre

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity-command-centre
  cancel-in-progress: false

jobs:
  update-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate activity dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: Shrijit0105
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from html import escape

          USER = os.environ["GH_USER"]
          TOKEN = os.environ["GH_TOKEN"]
          README = Path("README.md")

          START = "<!-- ACTIVITY-CENTRE:START -->"
          END = "<!-- ACTIVITY-CENTRE:END -->"

          def github_api(path):
              req = Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "GitHub-Activity-Command-Centre",
                  },
              )
              with urlopen(req, timeout=20) as response:
                  return json.load(response)

          def safe(value):
              return escape(str(value or ""), quote=True)

          def run_git(args):
              return subprocess.run(
                  ["git", *args],
                  capture_output=True,
                  text=True,
                  check=False,
              )

          # Fetch profile data.
          user = github_api(f"/users/{USER}")
          repos = github_api(
              f"/users/{USER}/repos?per_page=100&sort=updated&type=owner"
          )

          # Exclude forks and the profile README repository.
          owned_repos = [
              repo for repo in repos
              if not repo.get("fork")
              and repo.get("name") != USER
          ]

          # Count commits from the user's own repositories.
          # This is a recent-activity count, not a lifetime GitHub total.
          commits = []
          errors = []

          for repo in owned_repos:
              name = repo["full_name"]

              try:
                  data = github_api(
                      f"/repos/{name}/commits?author={USER}&per_page=5"
                  )
                  for item in data:
                      commit = item.get("commit", {})
                      author = commit.get("author") or {}
                      commits.append({
                          "repo": name,
                          "sha": item.get("sha", "")[:7],
                          "message": (
                              commit.get("message", "").splitlines()[0]
                              if commit.get("message")
                              else "Commit"
                          ),
                          "date": author.get("date", ""),
                          "url": item.get("html_url", ""),
                      })
              except (HTTPError, URLError, TimeoutError, ValueError) as exc:
                  errors.append(f"{name}: {type(exc).__name__}")

          commits.sort(key=lambda x: x["date"], reverse=True)
          commits = commits[:8]

          # Collect basic account and repository metrics.
          total_stars = sum(r.get("stargazers_count", 0) for r in owned_repos)
          total_forks = sum(r.get("forks_count", 0) for r in owned_repos)
          public_repos = user.get("public_repos", 0)

          now = datetime.now(timezone.utc)
          updated = now.strftime("%d %b %Y · %H:%M UTC")

          rows = []
          for item in commits:
              message = safe(item["message"][:75])
              repo = safe(item["repo"])
              sha = safe(item["sha"])
              url = safe(item["url"])
              date = safe(item["date"][:10])

              rows.append(
                  f"| `{date}` | `{repo}` | "
                  f"[`{sha}`]({url}) | {message} |"
              )

          if rows:
              commit_table = "\n".join([
                  "| DATE | REPOSITORY | COMMIT | MESSAGE |",
                  "|:--|:--|:--|:--|",
                  *rows,
              ])
          else:
              commit_table = (
                  "| No recent commits found | Check repository access, "
                  "API limits, and author attribution. | - | - |"
              )

          status = "OPERATIONAL" if not errors else "PARTIAL DATA"
          error_note = (
              f"\n> API errors: {len(errors)} repository request(s) failed. "
              "Some recent activity may be missing."
              if errors else ""
          )

          section = f"""<!-- ACTIVITY-CENTRE:START -->
          ## ◈ GITHUB ACTIVITY COMMAND CENTRE

          > `SYSTEM STATUS: {status}` · `LAST SYNC: {updated}`

          <table>
          <tr>
          <td width="25%" align="center">
          <b>PUBLIC REPOS</b><br/>
          <h2>{public_repos}</h2>
          </td>
          <td width="25%" align="center">
          <b>OWNED REPOS TRACKED</b><br/>
          <h2>{len(owned_repos)}</h2>
          </td>
          <td width="25%" align="center">
          <b>STARS EARNED</b><br/>
          <h2>{total_stars}</h2>
          </td>
          <td width="25%" align="center">
          <b>FORKS</b><br/>
          <h2>{total_forks}</h2>
          </td>
          </tr>
          </table>

          ### `> RECENT_COMMIT_STREAM`

          {commit_table}

          {error_note}

          <sub>
          Data source: GitHub REST API · Refresh: every 6 hours
          · Recent commits are limited to the latest 8 results across
          your owned public repositories.
          </sub>
          <!-- ACTIVITY-CENTRE:END -->"""

          if not README.exists():
              raise SystemExit("README.md was not found.")

          content = README.read_text(encoding="utf-8")

          if START in content and END in content:
              before, remainder = content.split(START, 1)
              _, after = remainder.split(END, 1)
              content = before + section + after
          elif START not in content and END not in content:
              content = content.rstrip() + "\n\n" + section + "\n"
          else:
              raise SystemExit(
                  "README markers are incomplete. Add both START and END "
                  "markers or remove the broken marker before running."
              )

          README.write_text(content, encoding="utf-8")
          print(f"Updated activity dashboard. Status: {status}")
          print(f"Repositories tracked: {len(owned_repos)}")
          print(f"Recent commits displayed: {len(commits)}")
          print(f"Repository API errors: {len(errors)}")
          PY

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
            exit 0
          fi

          git commit -m "chore: refresh GitHub activity command centre"
          git push origin HEAD:main
