name: Developer Introduction HUD

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/introduction.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Introduction HUD
        run: |
          python3 <<'PY'
          import os

          os.makedirs("assets", exist_ok=True)

          NAME = "SHRIJIT"
          ROLE = "SOFTWARE DEVELOPER • AI/ML ENTHUSIAST"
          DESCRIPTION = "Building software, exploring AI/ML, and learning by creating."

          svg = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1100"
               height="420"
               viewBox="0 0 1100 420">

            <defs>

              <!-- Web pattern -->
              <pattern id="web"
                       width="120"
                       height="120"
                       patternUnits="userSpaceOnUse">

                <path
                  d="M60 0
                     C60 30 30 60 0 60
                     M60 0
                     C60 30 90 60 120 60
                     M0 60
                     C30 60 60 90 60 120
                     M120 60
                     C90 60 60 90 60 120"
                  fill="none"
                  stroke="#16364a"
                  stroke-width="1"/>

                <circle cx="60"
                        cy="60"
                        r="30"
                        fill="none"
                        stroke="#16364a"
                        stroke-width="1"/>

                <circle cx="60"
                        cy="60"
                        r="50"
                        fill="none"
                        stroke="#102838"
                        stroke-width="1"/>
              </pattern>

              <!-- Glow -->
              <filter id="glow">
                <feGaussianBlur stdDeviation="4"
                                result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <linearGradient id="accent"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="0">

                <stop offset="0%"
                      stop-color="#ef4444"/>

                <stop offset="50%"
                      stop-color="#60a5fa"/>

                <stop offset="100%"
                      stop-color="#ef4444"/>

              </linearGradient>

            </defs>


            <!-- Background -->

            <rect width="1100"
                  height="420"
                  fill="#05080d"/>

            <rect width="1100"
                  height="420"
                  fill="url(#web)"
                  opacity="0.20"/>


            <!-- Main frame -->

            <rect x="18"
                  y="18"
                  width="1064"
                  height="384"
                  rx="18"
                  fill="none"
                  stroke="#143a52"
                  stroke-width="2"/>

            <rect x="25"
                  y="25"
                  width="1050"
                  height="370"
                  rx="14"
                  fill="none"
                  stroke="#ef4444"
                  stroke-width="1.5"
                  stroke-opacity="0.45">

              <animate
                attributeName="stroke-opacity"
                values="0.25;0.7;0.25"
                dur="3s"
                repeatCount="indefinite"/>

            </rect>


            <!-- Top label -->

            <text x="55"
                  y="62"
                  fill="#ef4444"
                  font-family="monospace"
                  font-size="12"
                  font-weight="bold"
                  letter-spacing="3">

              SYSTEM // INTRODUCTION
            </text>

            <text x="1045"
                  y="62"
                  text-anchor="end"
                  fill="#60a5fa"
                  font-family="monospace"
                  font-size="11"
                  letter-spacing="2">

              ONLINE
            </text>


            <!-- Central spider-inspired reticle -->

            <g transform="translate(190 215)">

              <circle r="105"
                      fill="none"
                      stroke="#143a52"
                      stroke-width="2"/>

              <circle r="82"
                      fill="none"
                      stroke="#ef4444"
                      stroke-opacity="0.55"
                      stroke-width="1.5">

                <animateTransform
                  attributeName="transform"
                  type="rotate"
                  from="0"
                  to="360"
                  dur="18s"
                  repeatCount="indefinite"/>

              </circle>


              <!-- Spider-inspired geometric symbol -->

              <path
                d="
                  M0 -58
                  L-15 -34
                  L-14 -5
                  L-30 20
                  L-13 16
                  L0 42
                  L13 16
                  L30 20
                  L14 -5
                  L15 -34
                  Z"
                fill="none"
                stroke="#ef4444"
                stroke-width="3"
                filter="url(#glow)"/>


              <!-- Scan line -->

              <line x1="-85"
                    y1="0"
                    x2="85"
                    y2="0"
                    stroke="#60a5fa"
                    stroke-width="1"
                    opacity="0.8">

                <animate
                  attributeName="y1"
                  values="-80;80;-80"
                  dur="4s"
                  repeatCount="indefinite"/>

                <animate
                  attributeName="y2"
                  values="-80;80;-80"
                  dur="4s"
                  repeatCount="indefinite"/>

              </line>

            </g>


            <!-- Introduction -->

            <text x="350"
                  y="155"
                  fill="#60a5fa"
                  font-family="monospace"
                  font-size="11"
                  letter-spacing="3">

              DEVELOPER PROFILE
            </text>

            <line x1="350"
                  y1="172"
                  x2="1020"
                  y2="172"
                  stroke="url(#accent)"
                  stroke-width="2"/>


            <text x="350"
                  y="230"
                  fill="#f8fafc"
                  font-family="monospace"
                  font-size="42"
                  font-weight="bold"
                  letter-spacing="6">

              {NAME}
            </text>


            <text x="350"
                  y="265"
                  fill="#ef4444"
                  font-family="monospace"
                  font-size="14"
                  font-weight="bold"
                  letter-spacing="2">

              {ROLE}
            </text>


            <text x="350"
                  y="315"
                  fill="#cbd5e1"
                  font-family="monospace"
                  font-size="13"
                  letter-spacing="0.8">

              {DESCRIPTION}
            </text>


            <!-- Small status -->

            <circle cx="355"
                    cy="355"
                    r="4"
                    fill="#22c55e">

              <animate
                attributeName="opacity"
                values="1;0.3;1"
                dur="1.6s"
                repeatCount="indefinite"/>

            </circle>

            <text x="370"
                  y="359"
                  fill="#22c55e"
                  font-family="monospace"
                  font-size="10"
                  letter-spacing="2">

              BUILD MODE ACTIVE
            </text>


            <!-- Corner markers -->

            <path d="M18 75 V18 H75"
                  fill="none"
                  stroke="#ef4444"
                  stroke-width="3"/>

            <path d="M1025 18 H1082 V75"
                  fill="none"
                  stroke="#60a5fa"
                  stroke-width="3"/>

            <path d="M18 345 V402 H75"
                  fill="none"
                  stroke="#60a5fa"
                  stroke-width="3"/>

            <path d="M1025 402 H1082 V345"
                  fill="none"
                  stroke="#ef4444"
                  stroke-width="3"/>


            <!-- Subtle scanner -->

            <rect x="28"
                  y="28"
                  width="1044"
                  height="364"
                  fill="none"
                  stroke="#60a5fa"
                  stroke-width="1"
                  opacity="0">

              <animate
                attributeName="opacity"
                values="0;0.4;0"
                dur="4s"
                repeatCount="indefinite"/>

            </rect>

          </svg>
          '''

          with open("assets/introduction.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Introduction HUD generated.")

      - name: Commit HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/introduction.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Spider Developer Introduction HUD"
          git push
