name: Developer Introduction HUD

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/introduction.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Spider HUD
        run: |
          python3 <<'PY'
          import os
          import html
          import math

          os.makedirs("assets", exist_ok=True)

          NAME = "SHRIJIT"
          ROLE = "SOFTWARE DEVELOPER • AI/ML ENTHUSIAST"
          TAGLINE = "BUILDING THINGS • BREAKING THINGS • LEARNING HOW THEY WORK"
          LOCATION = "INDIA"
          STATUS = "SYSTEM ONLINE"

          STACK = [
              "PYTHON",
              "C++",
              "JAVASCRIPT",
              "AI / ML",
              "DSA",
              "FULL STACK"
          ]

          WIDTH = 1100
          HEIGHT = 610

          stack_rows = ""

          for i, tech in enumerate(STACK):
              y = 385 + i * 30

              stack_rows += f"""
              <text x="755" y="{y}"
                    fill="#dbeafe"
                    font-family="monospace"
                    font-size="14"
                    letter-spacing="1.5">
                {html.escape(tech)}
              </text>

              <line x1="920" y1="{y-5}"
                    x2="1035" y2="{y-5}"
                    stroke="#143a52"
                    stroke-width="2"/>

              <circle cx="1048" cy="{y-5}"
                      r="4"
                      fill="#ef4444">
                <animate attributeName="opacity"
                         values="0.35;1;0.35"
                         dur="1.8s"
                         repeatCount="indefinite"/>
              </circle>
              """

          svg = f"""<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="{WIDTH}"
               height="{HEIGHT}"
               viewBox="0 0 {WIDTH} {HEIGHT}">

            <defs>

              <!-- Spider-tech glow -->
              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Subtle blue glow -->
              <filter id="blueGlow">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Web pattern -->
              <pattern id="web"
                       width="100"
                       height="100"
                       patternUnits="userSpaceOnUse">

                <path
                  d="M50 0
                     C50 25 25 50 0 50
                     M50 0
                     C50 25 75 50 100 50
                     M0 50
                     C25 50 50 75 50 100
                     M100 50
                     C75 50 50 75 50 100"
                  fill="none"
                  stroke="#143a52"
                  stroke-width="1"/>

                <circle cx="50"
                        cy="50"
                        r="25"
                        fill="none"
                        stroke="#143a52"
                        stroke-width="1"/>

                <circle cx="50"
                        cy="50"
                        r="42"
                        fill="none"
                        stroke="#102b3d"
                        stroke-width="1"/>
              </pattern>

              <linearGradient id="redBlue"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="0">
                <stop offset="0%" stop-color="#ef4444"/>
                <stop offset="50%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#ef4444"/>
              </linearGradient>

            </defs>


            <!-- ===================================================== -->
            <!-- BACKGROUND -->
            <!-- ===================================================== -->

            <rect width="100%"
                  height="100%"
                  fill="#05080d"/>

            <rect width="100%"
                  height="100%"
                  fill="url(#web)"
                  opacity="0.22"/>


            <!-- ===================================================== -->
            <!-- OUTER HUD FRAME -->
            <!-- ===================================================== -->

            <rect x="15"
                  y="15"
                  width="1070"
                  height="580"
                  rx="18"
                  fill="none"
                  stroke="#143a52"
                  stroke-width="2"/>

            <rect x="22"
                  y="22"
                  width="1056"
                  height="566"
                  rx="14"
                  fill="none"
                  stroke="#ef4444"
                  stroke-opacity="0.45"
                  stroke-width="1.5">

              <animate
                attributeName="stroke-opacity"
                values="0.25;0.75;0.25"
                dur="3s"
                repeatCount="indefinite"/>
            </rect>


            <!-- ===================================================== -->
            <!-- TOP SYSTEM BAR -->
            <!-- ===================================================== -->

            <text x="55"
                  y="58"
                  fill="#ef4444"
                  font-family="monospace"
                  font-size="13"
                  font-weight="bold"
                  letter-spacing="3">

              SPIDER SYSTEM // DEV-01
            </text>

            <text x="1045"
                  y="58"
                  text-anchor="end"
                  fill="#60a5fa"
                  font-family="monospace"
                  font-size="12"
                  letter-spacing="2">

              {STATUS}
            </text>


            <!-- ===================================================== -->
            <!-- MAIN RETICLE -->
            <!-- ===================================================== -->

            <g transform="translate(350 295)">

              <!-- outer targeting rings -->

              <circle r="165"
                      fill="none"
                      stroke="#12394f"
                      stroke-width="2"/>

              <circle r="138"
                      fill="none"
                      stroke="#1b526e"
                      stroke-width="1"/>

              <circle r="112"
                      fill="none"
                      stroke="#ef4444"
                      stroke-opacity="0.65"
                      stroke-width="1.5">

                <animateTransform
                  attributeName="transform"
                  type="rotate"
                  from="0"
                  to="360"
                  dur="18s"
                  repeatCount="indefinite"/>
              </circle>


              <!-- targeting ticks -->

              <line x1="0"
                    y1="-165"
                    x2="0"
                    y2="-142"
                    stroke="#ef4444"
                    stroke-width="3"/>

              <line x1="0"
                    y1="142"
                    x2="0"
                    y2="165"
                    stroke="#ef4444"
                    stroke-width="3"/>

              <line x1="-165"
                    y1="0"
                    x2="-142"
                    y2="0"
                    stroke="#ef4444"
                    stroke-width="3"/>

              <line x1="142"
                    y1="0"
                    x2="165"
                    y2="0"
                    stroke="#ef4444"
                    stroke-width="3"/>


              <!-- center spider-like geometric mark -->

              <path
                d="
                  M0 -75
                  L-20 -45
                  L-18 -5
                  L-38 28
                  L-17 23
                  L0 55
                  L17 23
                  L38 28
                  L18 -5
                  L20 -45
                  Z"
                fill="none"
                stroke="#ef4444"
                stroke-width="3"
                filter="url(#glow)"/>

              <circle r="5"
                      fill="#ef4444">

                <animate
                  attributeName="r"
                  values="4;8;4"
                  dur="1.5s"
                  repeatCount="indefinite"/>

                <animate
                  attributeName="opacity"
                  values="0.5;1;0.5"
                  dur="1.5s"
                  repeatCount="indefinite"/>
              </circle>


              <!-- scanner -->

              <line x1="-150"
                    y1="0"
                    x2="150"
                    y2="0"
                    stroke="#60a5fa"
                    stroke-width="1"
                    opacity="0.8">

                <animate
                  attributeName="y1"
                  values="-150;150;-150"
                  dur="4s"
                  repeatCount="indefinite"/>

                <animate
                  attributeName="y2"
                  values="-150;150;-150"
                  dur="4s"
                  repeatCount="indefinite"/>
              </line>

            </g>


            <!-- ===================================================== -->
            <!-- IDENTITY PANEL -->
            <!-- ===================================================== -->

            <text x="575"
                  y="145"
                  fill="#60a5fa"
                  font-family="monospace"
                  font-size="11"
                  letter-spacing="3">

              SUBJECT IDENTIFICATION
            </text>

            <line x1="575"
                  y1="160"
                  x2="1035"
                  y2="160"
                  stroke="url(#redBlue)"
                  stroke-width="2"/>


            <text x="575"
                  y="215"
                  fill="#f8fafc"
                  font-family="monospace"
                  font-size="42"
                  font-weight="bold"
                  letter-spacing="6">

              {NAME}
            </text>

            <text x="575"
                  y="245"
                  fill="#ef4444"
                  font-family="monospace"
                  font-size="14"
                  font-weight="bold"
                  letter-spacing="2">

              {ROLE}
            </text>

            <text x="575"
                  y="285"
                  fill="#94a3b8"
                  font-family="monospace"
                  font-size="12"
                  letter-spacing="1">

              {TAGLINE}
            </text>


            <!-- ===================================================== -->
            <!-- TELEMETRY -->
            <!-- ===================================================== -->

            <text x="575"
                  y="325"
                  fill="#60a5fa"
                  font-family="monospace"
                  font-size="11"
                  letter-spacing="3">

              TELEMETRY
            </text>

            <text x="575"
                  y="350"
                  fill="#dbeafe"
                  font-family="monospace"
                  font-size="13">

              LOCATION
            </text>

            <text x="700"
                  y="350"
                  fill="#ef4444"
                  font-family="monospace"
                  font-size="13">

              {LOCATION}
            </text>


            <!-- ===================================================== -->
            <!-- TECH STACK -->
            <!-- ===================================================== -->

            <text x="755"
                  y="350"
                  fill="#60a5fa"
                  font-family="monospace"
                  font-size="11"
                  letter-spacing="3">

              LOADOUT
            </text>

            {stack_rows}


            <!-- ===================================================== -->
            <!-- BOTTOM STATUS -->
            <!-- ===================================================== -->

            <line x1="55"
                  y1="545"
                  x2="1045"
                  y2="545"
                  stroke="#143a52"
                  stroke-width="1"/>

            <circle cx="70"
                    cy="568"
                    r="5"
                    fill="#22c55e">

              <animate
                attributeName="opacity"
                values="1;0.3;1"
                dur="1.6s"
                repeatCount="indefinite"/>

            </circle>

            <text x="85"
                  y="573"
                  fill="#22c55e"
                  font-family="monospace"
                  font-size="11"
                  letter-spacing="2">

              ALL SYSTEMS NOMINAL
            </text>

            <text x="1045"
                  y="573"
                  text-anchor="end"
                  fill="#475569"
                  font-family="monospace"
                  font-size="10"
                  letter-spacing="2">

              WEB-LINK // ACTIVE
            </text>


            <!-- ===================================================== -->
            <!-- CORNER MARKERS -->
            <!-- ===================================================== -->

            <path d="M15 70 V15 H70"
                  fill="none"
                  stroke="#ef4444"
                  stroke-width="3"/>

            <path d="M1030 15 H1085 V70"
                  fill="none"
                  stroke="#60a5fa"
                  stroke-width="3"/>

            <path d="M15 540 V595 H70"
                  fill="none"
                  stroke="#60a5fa"
                  stroke-width="3"/>

            <path d="M1030 595 H1085 V540"
                  fill="none"
                  stroke="#ef4444"
                  stroke-width="3"/>


            <!-- animated HUD scanner -->

            <rect x="25"
                  y="25"
                  width="1050"
                  height="560"
                  fill="none"
                  stroke="#60a5fa"
                  stroke-width="1"
                  opacity="0">

              <animate
                attributeName="opacity"
                values="0;0.5;0"
                dur="4s"
                repeatCount="indefinite"/>
            </rect>

          </svg>
          """

          with open("assets/introduction.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Spider Developer HUD generated.")
          PY

      - name: Commit HUD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/introduction.svg

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Spider Developer Introduction HUD"
          git push
