name: Developer Introduction HUD

on:
  workflow_dispatch:

  push:
    paths:
      - "introduction.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Introduction HUD
        shell: python
        run: |

          import html
          from pathlib import Path

          # ==========================================================
          # INTRODUCTION CONFIG
          # ==========================================================

          NAME = "SHRIJIT"

          ROLE = "SOFTWARE DEVELOPER • AI/ML ENTHUSIAST"

          TAGLINE = (
              "Building things, breaking things, "
              "learning how they work."
          )

          LOCATION = "INDIA"

          STATUS = "OPEN TO BUILD"

          STACK = [
              "Python",
              "C++",
              "JavaScript",
              "AI/ML",
              "DSA",
              "Full Stack"
          ]

          # ==========================================================
          # ESCAPE XML
          # ==========================================================

          NAME = html.escape(NAME)
          ROLE = html.escape(ROLE)
          TAGLINE = html.escape(TAGLINE)
          LOCATION = html.escape(LOCATION)
          STATUS = html.escape(STATUS)

          STACK = [
              html.escape(item)
              for item in STACK
          ]

          # ==========================================================
          # STACK CHIPS
          # ==========================================================

          chips = []

          x = 55
          y = 330

          for item in STACK:

              width = max(
                  90,
                  len(item) * 9 + 34
              )

              chips.append(
                  f"""
                  <rect
                    x="{x}"
                    y="{y}"
                    width="{width}"
                    height="32"
                    rx="6"
                    fill="#07130f"
                    stroke="#00ff88"
                    stroke-opacity="0.40"
                  />

                  <text
                    x="{x + width / 2}"
                    y="{y + 21}"
                    text-anchor="middle"
                    fill="#9affc7"
                    font-family="monospace"
                    font-size="10"
                    font-weight="700"
                  >
                    {item}
                  </text>
                  """
              )

              x += width + 12

              if x > 820:

                  x = 55
                  y += 45

          chips_svg = "".join(chips)

          # ==========================================================
          # SVG
          # ==========================================================

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="980"
            height="500"
            viewBox="0 0 980 500"
          >

            <defs>

              <linearGradient
                id="hudGradient"
                x1="0"
                y1="0"
                x2="1"
                y2="0"
              >

                <stop
                  offset="0%"
                  stop-color="#00ff88"
                />

                <stop
                  offset="100%"
                  stop-color="#00ffaa"
                />

              </linearGradient>

              <filter id="glow">

                <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
                />

                <feMerge>

                  <feMergeNode in="blur"/>

                  <feMergeNode
                    in="SourceGraphic"
                  />

                </feMerge>

              </filter>

            </defs>


            <!-- ================================================= -->
            <!-- BACKGROUND -->
            <!-- ================================================= -->

            <rect
              width="980"
              height="500"
              rx="14"
              fill="#050807"
            />


            <!-- ================================================= -->
            <!-- BORDER -->
            <!-- ================================================= -->

            <rect
              x="1"
              y="1"
              width="978"
              height="498"
              rx="14"
              fill="none"
              stroke="#00ff88"
              stroke-width="1"
              stroke-opacity="0.35"
            >

              <animate
                attributeName="stroke-opacity"
                values="0.25;0.55;0.25"
                dur="3s"
                repeatCount="indefinite"
              />

            </rect>


            <!-- ================================================= -->
            <!-- TOP LABEL -->
            <!-- ================================================= -->

            <text
              x="55"
              y="42"
              fill="#00ff88"
              font-family="monospace"
              font-size="11"
              font-weight="700"
              letter-spacing="2"
            >
              DEVELOPER IDENTITY SYSTEM
            </text>


            <text
              x="925"
              y="42"
              text-anchor="end"
              fill="#35694f"
              font-family="monospace"
              font-size="10"
            >
              PROFILE://INTRO
            </text>


            <!-- ================================================= -->
            <!-- SCANNER -->
            <!-- ================================================= -->

            <rect
              x="40"
              y="67"
              width="900"
              height="1"
              fill="#00ff88"
              opacity="0.12"
            />


            <rect
              x="40"
              y="66"
              width="120"
              height="2"
              fill="#00ff88"
              filter="url(#glow)"
            >

              <animate
                attributeName="x"
                values="40;820;40"
                dur="4s"
                repeatCount="indefinite"
              />

            </rect>


            <!-- ================================================= -->
            <!-- MAIN IDENTITY -->
            <!-- ================================================= -->

            <text
              x="55"
              y="135"
              fill="#f1fff7"
              font-family="monospace"
              font-size="44"
              font-weight="700"
              letter-spacing="3"
            >
              {NAME}
            </text>


            <rect
              x="55"
              y="155"
              width="420"
              height="2"
              fill="url(#hudGradient)"
              filter="url(#glow)"
            >

              <animate
                attributeName="width"
                values="180;420;180"
                dur="3s"
                repeatCount="indefinite"
              />

            </rect>


            <!-- ================================================= -->
            <!-- ROLE -->
            <!-- ================================================= -->

            <text
              x="55"
              y="195"
              fill="#00ff88"
              font-family="monospace"
              font-size="15"
              font-weight="700"
              letter-spacing="1"
            >
              {ROLE}
            </text>


            <!-- ================================================= -->
            <!-- TAGLINE -->
            <!-- ================================================= -->

            <text
              x="55"
              y="238"
              fill="#c8ffe0"
              font-family="monospace"
              font-size="13"
            >
              {TAGLINE}
            </text>


            <!-- ================================================= -->
            <!-- STATUS PANEL -->
            <!-- ================================================= -->

            <rect
              x="650"
              y="105"
              width="270"
              height="135"
              rx="10"
              fill="#07100c"
              stroke="#00ff88"
              stroke-opacity="0.25"
            />


            <circle
              cx="685"
              cy="140"
              r="6"
              fill="#00ff88"
              filter="url(#glow)"
            >

              <animate
                attributeName="r"
                values="5;8;5"
                dur="1.5s"
                repeatCount="indefinite"
              />

              <animate
                attributeName="opacity"
                values="1;0.45;1"
                dur="1.5s"
                repeatCount="indefinite"
              />

            </circle>


            <text
              x="705"
              y="145"
              fill="#00ff88"
              font-family="monospace"
              font-size="11"
              font-weight="700"
            >
              {STATUS}
            </text>


            <text
              x="675"
              y="180"
              fill="#4d9975"
              font-family="monospace"
              font-size="9"
              letter-spacing="1"
            >
              LOCATION
            </text>


            <text
              x="675"
              y="202"
              fill="#d7ffea"
              font-family="monospace"
              font-size="12"
              font-weight="700"
            >
              {LOCATION}
            </text>


            <text
              x="675"
              y="225"
              fill="#35694f"
              font-family="monospace"
              font-size="9"
            >
              SYSTEM ONLINE
            </text>


            <!-- ================================================= -->
            <!-- STACK -->
            <!-- ================================================= -->

            <text
              x="55"
              y="295"
              fill="#4d9975"
              font-family="monospace"
              font-size="10"
              letter-spacing="2"
            >
              PRIMARY STACK
            </text>


            {chips_svg}


            <!-- ================================================= -->
            <!-- FOOTER -->
            <!-- ================================================= -->

            <line
              x1="55"
              y1="425"
              x2="925"
              y2="425"
              stroke="#00ff88"
              stroke-opacity="0.15"
            />


            <text
              x="55"
              y="455"
              fill="#35694f"
              font-family="monospace"
              font-size="10"
              letter-spacing="1"
            >
              INITIALIZING DEVELOPER PROFILE...
            </text>


            <text
              x="925"
              y="455"
              text-anchor="end"
              fill="#00ff88"
              font-family="monospace"
              font-size="10"
            >
              [ ONLINE ]
            </text>


            <!-- ================================================= -->
            <!-- CURSOR -->
            <!-- ================================================= -->

            <rect
              x="55"
              y="468"
              width="7"
              height="14"
              fill="#00ff88"
            >

              <animate
                attributeName="opacity"
                values="1;0;1"
                dur="0.8s"
                repeatCount="indefinite"
              />

            </rect>

          </svg>
          """

          # ==========================================================
          # WRITE
          # ==========================================================

          output = Path(
              "assets/introduction.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Generated {output}"
          )


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit Introduction HUD
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/introduction.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "Update developer introduction HUD"

          git push


