name: GitHub Activity Monitor

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  pull_request:
    branches:
      - main

  issues:
    types:
      - opened
      - closed

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub Activity
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import html
          from pathlib import Path
          from datetime import datetime, timezone

          def git(command):
              try:
                  return subprocess.check_output(
                      command,
                      shell=True,
                      text=True,
                      stderr=subprocess.DEVNULL
                  ).strip()
              except:
                  return ""

          def esc(value):
              return html.escape(str(value))

          # ----------------------------------------
          # Repository
          # ----------------------------------------

          repo = os.environ.get("REPO", "Unknown")
          branch = os.environ.get("BRANCH", "main")
          event = os.environ.get("EVENT", "unknown")
          actor = os.environ.get("ACTOR", "unknown")

          # ----------------------------------------
          # REAL GIT HISTORY
          # ----------------------------------------

          total_commits = git(
              "git rev-list --all --count"
          )

          if not total_commits:
              total_commits = git(
                  "git rev-list HEAD --count"
              )

          if not total_commits:
              total_commits = "0"

          latest_message = git(
              "git log -1 --pretty=%s"
          ) or "No commit found"

          latest_author = git(
              "git log -1 --pretty=%an"
          ) or "Unknown"

          latest_sha = git(
              "git log -1 --pretty=%h"
          ) or "------"

          latest_date = git(
              "git log -1 --date=format:'%d %b %Y %H:%M'"
              " --format='%ad'"
          ) or "Unknown"

          # ----------------------------------------
          # Recent commits
          # ----------------------------------------

          recent_commits = git(
              "git log -5 --pretty=format:'%h|%an|%s'"
          )

          recent_rows = []

          if recent_commits:
              for line in recent_commits.splitlines():
                  parts = line.split("|", 2)

                  if len(parts) == 3:
                      sha, author, message = parts

                      recent_rows.append(
                          f"| `{esc(sha)}` | "
                          f"{esc(author)} | "
                          f"{esc(message[:70])} |"
                      )

          if not recent_rows:
              recent_rows.append(
                  "| `------` | Unknown | No commits found |"
              )

          # ----------------------------------------
          # Repository file count
          # ----------------------------------------

          file_count = git(
              "git ls-files | wc -l"
          ) or "0"

          # ----------------------------------------
          # README activity block
          # ----------------------------------------

          readme = Path("README.md")

          if not readme.exists():
              print("README.md not found.")
              exit(0)

          content = readme.read_text(
              encoding="utf-8"
          )

          start_marker = "<!-- ACTIVITY_START -->"
          end_marker = "<!-- ACTIVITY_END -->"

          activity = f'''{start_marker}

          ## ⚡ Repository Activity

          <div align="center">

          | Metric | Value |
          |---|---|
          | 📝 Latest Commit | `{esc(latest_message[:80])}` |
          | 👨‍💻 Author | `{esc(latest_author)}` |
          | 🔖 Commit | `{esc(latest_sha)}` |
          | 🌿 Branch | `{esc(branch)}` |
          | 📦 Total Commits | `{esc(total_commits)}` |
          | 📁 Tracked Files | `{esc(file_count)}` |
          | ⚙️ Trigger | `{esc(event)}` |
          | 🤖 Updated By | `{esc(actor)}` |
          | 🕐 Last Updated | `{esc(latest_date)}` |

          </div>

          ### 🧬 Recent Commits

          | Commit | Author | Message |
          |---|---|---|
          {chr(10).join(recent_rows)}

          > 🔄 This section is automatically updated by GitHub Actions.

          {end_marker}'''

          # ----------------------------------------
          # Replace existing section
          # ----------------------------------------

          if start_marker in content and end_marker in content:

              before = content.split(
                  start_marker,
                  1
              )[0]

              after = content.split(
                  end_marker,
                  1
              )[1]

              new_content = (
                  before
                  + activity
                  + after
              )

          else:

              new_content = (
                  content.rstrip()
                  + "\n\n"
                  + activity
                  + "\n"
              )

          readme.write_text(
              new_content,
              encoding="utf-8"
          )

          # ----------------------------------------
          # Debug output
          # ----------------------------------------

          print("========================================")
          print("GITHUB ACTIVITY GENERATED")
          print("========================================")
          print(f"Repository       : {repo}")
          print(f"Branch           : {branch}")
          print(f"Total commits    : {total_commits}")
          print(f"Tracked files    : {file_count}")
          print(f"Latest commit    : {latest_sha}")
          print(f"Latest author    : {latest_author}")
          print(f"Latest message   : {latest_message}")
          print(f"Event            : {event}")
          print("========================================")
          PY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit activity update
        run: |
          git add README.md

          if git diff --cached --quiet; then
            echo "No README activity changes."
            exit 0
          fi

          git commit -m "chore: update GitHub activity"

      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push activity update
        run: |
          git push origin HEAD:main
