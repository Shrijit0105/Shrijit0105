<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHRIJIT // SYSTEM CLOCK</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          rgba(5, 8, 15, 0.95),
          rgba(5, 8, 15, 0.98)
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 29px,
          rgba(50, 100, 160, 0.08) 30px
        );

      color: #e8edf5;

      font-family:
        "Courier New",
        monospace;

      overflow: hidden;
    }

    .hud {
      width: min(900px, 92vw);
      padding: 42px;

      position: relative;

      border: 1px solid #20324f;
      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(10, 15, 27, 0.98),
          rgba(7, 11, 20, 0.98)
        );

      box-shadow:
        0 0 35px rgba(230, 57, 70, 0.08),
        inset 0 0 35px rgba(77, 163, 255, 0.04);

      overflow: hidden;
    }

    .hud::before {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(77, 163, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(77, 163, 255, 0.035) 1px,
          transparent 1px
        );

      background-size: 30px 30px;

      pointer-events: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      position: relative;
      z-index: 2;

      margin-bottom: 35px;
    }

    .title {
      color: #e63946;

      font-size: 14px;
      font-weight: bold;

      letter-spacing: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #4da3ff;

      font-size: 11px;
      letter-spacing: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #e63946;

      box-shadow:
        0 0 10px rgba(230, 57, 70, 0.8);

      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.8);
        opacity: 0.35;
      }
    }

    .clock-area {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      gap: 55px;
    }

    .clock {
      width: 210px;
      height: 210px;

      flex-shrink: 0;

      position: relative;

      border: 2px solid #16263f;
      border-radius: 50%;

      box-shadow:
        0 0 25px rgba(77, 163, 255, 0.08),
        inset 0 0 25px rgba(230, 57, 70, 0.05);
    }

    .clock::before {
      content: "";

      position: absolute;

      inset: 10px;

      border: 1px dashed #263d5f;
      border-radius: 50%;

      animation: rotate 30s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    .tick {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 2px;
      height: 9px;

      background: #4da3ff;

      transform-origin: 50% 95px;
    }

    .t1 { transform: translate(-50%, -95px) rotate(0deg); }
    .t2 { transform: translate(-50%, -95px) rotate(30deg); }
    .t3 { transform: translate(-50%, -95px) rotate(60deg); }
    .t4 { transform: translate(-50%, -95px) rotate(90deg); }
    .t5 { transform: translate(-50%, -95px) rotate(120deg); }
    .t6 { transform: translate(-50%, -95px) rotate(150deg); }
    .t7 { transform: translate(-50%, -95px) rotate(180deg); }
    .t8 { transform: translate(-50%, -95px) rotate(210deg); }
    .t9 { transform: translate(-50%, -95px) rotate(240deg); }
    .t10 { transform: translate(-50%, -95px) rotate(270deg); }
    .t11 { transform: translate(-50%, -95px) rotate(300deg); }
    .t12 { transform: translate(-50%, -95px) rotate(330deg); }

    .hand {
      position: absolute;

      left: 50%;
      bottom: 50%;

      transform-origin: 50% 100%;

      border-radius: 4px;

      transition: transform 0.15s linear;
    }

    .hour {
      width: 6px;
      height: 55px;

      background: #e8edf5;
    }

    .minute {
      width: 4px;
      height: 73px;

      background: #4da3ff;
    }

    .second {
      width: 2px;
      height: 82px;

      background: #e63946;
    }

    .center {
      position: absolute;

      width: 10px;
      height: 10px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: #e63946;

      box-shadow:
        0 0 12px rgba(230, 57, 70, 0.8);
    }

    .information {
      flex: 1;
    }

    .time {
      font-size: clamp(38px, 7vw, 64px);

      font-weight: bold;

      color: #4da3ff;

      letter-spacing: 3px;

      text-shadow:
        0 0 14px rgba(77, 163, 255, 0.25);
    }

    .date {
      margin-top: 12px;

      font-size: 18px;

      letter-spacing: 3px;

      color: #e8edf5;
    }

    .timezone {
      margin-top: 12px;

      color: #e63946;

      font-size: 12px;

      letter-spacing: 2px;
    }

    .location {
      margin-top: 8px;

      color: #637896;

      font-size: 11px;

      letter-spacing: 2px;
    }

    .footer {
      position: relative;
      z-index: 2;

      margin-top: 40px;
      padding-top: 14px;

      border-top: 1px solid #1d2d47;

      display: flex;
      justify-content: space-between;

      color: #415572;

      font-size: 9px;

      letter-spacing: 2px;
    }

    @media (max-width: 650px) {

      .hud {
        padding: 25px;
      }

      .clock-area {
        flex-direction: column;
        gap: 30px;
      }

      .clock {
        width: 180px;
        height: 180px;
      }

      .information {
        text-align: center;
      }

      .footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }

  </style>
</head>

<body>

  <main class="hud">

    <header class="header">

      <div class="title">
        SYSTEM TIME
      </div>

      <div class="status">
        <span class="status-dot"></span>
        LIVE
      </div>

    </header>

    <section class="clock-area">

      <div class="clock">

        <span class="tick t1"></span>
        <span class="tick t2"></span>
        <span class="tick t3"></span>
        <span class="tick t4"></span>
        <span class="tick t5"></span>
        <span class="tick t6"></span>
        <span class="tick t7"></span>
        <span class="tick t8"></span>
        <span class="tick t9"></span>
        <span class="tick t10"></span>
        <span class="tick t11"></span>
        <span class="tick t12"></span>

        <div id="hourHand" class="hand hour"></div>
        <div id="minuteHand" class="hand minute"></div>
        <div id="secondHand" class="hand second"></div>

        <div class="center"></div>

      </div>

      <div class="information">

        <div id="time" class="time">
          00:00:00
        </div>

        <div id="date" class="date">
          01 JAN 1970
        </div>

        <div id="timezone" class="timezone">
          DETECTING TIMEZONE...
        </div>

        <div id="location" class="location">
          LOCAL SYSTEM TIME
        </div>

      </div>

    </section>

    <footer class="footer">

      <span>
        DEVELOPER TELEMETRY
      </span>

      <span>
        REGIONAL CLOCK // ACTIVE
      </span>

    </footer>

  </main>

  <script>

    const timeElement =
      document.getElementById("time");

    const dateElement =
      document.getElementById("date");

    const timezoneElement =
      document.getElementById("timezone");

    const hourHand =
      document.getElementById("hourHand");

    const minuteHand =
      document.getElementById("minuteHand");

    const secondHand =
      document.getElementById("secondHand");


    function updateClock() {

      const now = new Date();

      const hours =
        now.getHours();

      const minutes =
        now.getMinutes();

      const seconds =
        now.getSeconds();

      const milliseconds =
        now.getMilliseconds();


      /*
       * Smooth second-hand movement
       */
      const preciseSeconds =
        seconds + milliseconds / 1000;


      const hourAngle =
        (hours % 12) * 30 +
        minutes * 0.5;

      const minuteAngle =
        minutes * 6 +
        seconds * 0.1;

      const secondAngle =
        preciseSeconds * 6;


      hourHand.style.transform =
        `translateX(-50%) rotate(${hourAngle}deg)`;

      minuteHand.style.transform =
        `translateX(-50%) rotate(${minuteAngle}deg)`;

      secondHand.style.transform =
        `translateX(-50%) rotate(${secondAngle}deg)`;


      /*
       * Digital clock
       */
      timeElement.textContent =
        now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });


      /*
       * Local date
       */
      dateElement.textContent =
        now.toLocaleDateString([], {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }).toUpperCase();


      /*
       * Detect viewer's timezone
       */
      const timezone =
        Intl.DateTimeFormat()
          .resolvedOptions()
          .timeZone;


      timezoneElement.textContent =
        timezone.toUpperCase();

    }


    /*
     * Update immediately
     */
    updateClock();


    /*
     * Keep the clock alive
     */
    setInterval(
      updateClock,
      100
    );

  </script>

</body>

</html>
